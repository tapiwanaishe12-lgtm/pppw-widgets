<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reading Pace & Finish Date Estimator</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 440px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 18px; line-height: 1.4; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .field input:focus { outline: none; border-color: var(--ppw-green); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 6px 0 16px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .progress-track {
    width: 100%;
    height: 10px;
    background: var(--ppw-green-light);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill { height: 100%; background: var(--ppw-green); border-radius: 5px; transition: width 0.2s ease; }
  .progress-caption { font-size: 14px; font-weight: 700; color: var(--ppw-green-dark); text-align: center; margin-bottom: 14px; }
  .snapshot-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .snapshot-num { font-size: 16px; font-weight: 800; color: var(--ppw-green-dark); line-height: 1.1; }
  .snapshot-label { font-size: 10px; color: var(--ppw-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    background: var(--ppw-green-light);
    border-radius: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Reading Pace Estimator</h1>
  <div class="desc">Enter what you're reading, your progress, and your pace — see how far through you are and roughly when you'll actually finish.</div>

  <div class="field">
    <label for="bookName">What you're reading (optional)</label>
    <input type="text" id="bookName" placeholder="e.g. Atomic Habits">
  </div>

  <div class="two-col">
    <div class="field">
      <label for="totalPages">Total pages</label>
      <input type="number" id="totalPages" placeholder="e.g. 320" min="0" step="1">
    </div>
    <div class="field">
      <label for="currentPage">Current page</label>
      <input type="number" id="currentPage" placeholder="e.g. 120" min="0" step="1">
    </div>
  </div>

  <div class="field">
    <label for="pagesPerWeek">Pages read in a typical week</label>
    <input type="number" id="pagesPerWeek" placeholder="e.g. 40" min="0" step="1">
  </div>

  <button class="primary" id="calcBtn">Check My Progress</button>

  <div class="result" id="resultBox">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    <div class="progress-caption" id="progressCaption"></div>
    <div class="snapshot-row">
      <div class="snapshot-box">
        <div class="snapshot-num" id="pagesLeft">0</div>
        <div class="snapshot-label">Pages Left</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="weeksLeft">–</div>
        <div class="snapshot-label">Weeks To Go</div>
      </div>
    </div>
    <div class="note" id="noteBox"></div>
  </div>
</div>

<script>
(function() {
  document.getElementById('calcBtn').addEventListener('click', () => {
    const name = document.getElementById('bookName').value.trim() || 'This book';
    const total = parseFloat(document.getElementById('totalPages').value) || 0;
    const current = parseFloat(document.getElementById('currentPage').value) || 0;
    const pace = parseFloat(document.getElementById('pagesPerWeek').value) || 0;

    if (total <= 0) {
      document.getElementById('noteBox').textContent = 'Enter the total page count to see your progress.';
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressCaption').textContent = '';
      document.getElementById('pagesLeft').textContent = '0';
      document.getElementById('weeksLeft').textContent = '–';
      return;
    }

    const pct = Math.max(0, Math.min(100, Math.round((current / total) * 100)));
    const pagesLeft = Math.max(0, total - current);

    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCaption').textContent = `${name}: ${pct}% through`;
    document.getElementById('pagesLeft').textContent = pagesLeft;

    const noteBox = document.getElementById('noteBox');
    const weeksLeftEl = document.getElementById('weeksLeft');

    if (pagesLeft === 0) {
      weeksLeftEl.textContent = '0';
      noteBox.textContent = 'Finished — time to log it and pick the next one.';
    } else if (pace <= 0) {
      weeksLeftEl.textContent = '–';
      noteBox.textContent = 'Add your typical weekly pace to see an estimated finish date.';
    } else {
      const weeksLeft = Math.ceil(pagesLeft / pace);
      weeksLeftEl.textContent = weeksLeft;
      noteBox.textContent = `At ${pace} pages/week, you'll likely finish in about ${weeksLeft} week${weeksLeft === 1 ? '' : 's'}.`;
    }

    document.getElementById('resultBox').classList.add('show');
  });
})();
</script>

</body>
</html>
