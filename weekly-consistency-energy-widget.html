<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Consistency & Energy Trend</title>
<style>
  :root {
    --green: #16a34a;
    --green-dark: #15803d;
    --green-light: #dcfce7;
    --black: #111111;
    --white: #ffffff;
    --gray: #6b7280;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--black);
    padding: 20px;
  }

  .widget {
    max-width: 560px;
    margin: 0 auto;
  }

  .section {
    margin-bottom: 26px;
  }

  .section:last-child {
    margin-bottom: 0;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h2 {
    margin: 0 0 4px 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--black);
  }

  .header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--gray);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  /* Consistency Score */
  .consistency-inputs {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .consistency-inputs .field {
    flex: 1;
  }

  .consistency-inputs label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 5px;
  }

  .consistency-inputs input {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--black);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .consistency-inputs input:focus {
    border-color: var(--green);
  }

  .progress-track {
    width: 100%;
    height: 22px;
    background: #f3f4f6;
    border-radius: 11px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 11px 0 0 11px;
  }

  .progress-text {
    text-align: center;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--gray);
    font-weight: 600;
  }

  .progress-text .pct {
    color: var(--green-dark);
    font-weight: 700;
  }

  /* Energy Trend */
  .energy-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .energy-label {
    width: 90px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    flex-shrink: 0;
  }

  .energy-scale {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .energy-scale button {
    aspect-ratio: 1 / 1;
    border-radius: 7px;
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--black);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }

  .energy-scale button:hover {
    border-color: var(--green);
  }

  .energy-scale button.selected {
    background: var(--green);
    border-color: var(--green-dark);
    color: var(--white);
    transform: scale(1.06);
  }

  .energy-result {
    background: var(--green-light);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
    font-size: 13px;
    color: var(--green-dark);
    font-weight: 700;
    min-height: 20px;
  }

  .energy-result.empty {
    color: var(--gray);
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="widget">

  <div class="section">
    <div class="header">
      <h2>✅ Weekly Consistency Score</h2>
      <p>How many of your planned sessions actually happened?</p>
    </div>

    <div class="consistency-inputs">
      <div class="field">
        <label for="plannedInput">Sessions Planned</label>
        <input type="number" id="plannedInput" placeholder="e.g. 5" min="0">
      </div>
      <div class="field">
        <label for="completedInput">Sessions Completed</label>
        <input type="number" id="completedInput" placeholder="e.g. 4" min="0">
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="consistencyFill"></div>
    </div>
    <div class="progress-text" id="consistencyText">Enter both numbers to see your consistency</div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="header">
      <h2>⚡ Weekly Energy Trend</h2>
      <p>No watch tracks a week-long arc. Rate Monday vs Sunday.</p>
    </div>

    <div class="energy-row">
      <div class="energy-label">Start of Week</div>
      <div class="energy-scale" id="startScale"></div>
    </div>
    <div class="energy-row">
      <div class="energy-label">End of Week</div>
      <div class="energy-scale" id="endScale"></div>
    </div>

    <div class="energy-result empty" id="energyResult">
      Rate both to see how your energy moved
    </div>
  </div>

</div>

<script>
  // Weekly Consistency Score
  const plannedInput = document.getElementById('plannedInput');
  const completedInput = document.getElementById('completedInput');
  const consistencyFill = document.getElementById('consistencyFill');
  const consistencyText = document.getElementById('consistencyText');

  function updateConsistency() {
    const planned = parseFloat(plannedInput.value);
    const completed = parseFloat(completedInput.value);

    if (!planned || planned <= 0 || isNaN(completed) || completed < 0) {
      consistencyFill.style.width = '0%';
      consistencyText.textContent = "Enter both numbers to see your consistency";
      return;
    }

    const pct = Math.min((completed / planned) * 100, 100);
    consistencyFill.style.width = pct + '%';

    if (completed >= planned) {
      consistencyText.innerHTML = `<span class="pct">100%</span> — hit every planned session this week`;
    } else {
      consistencyText.innerHTML = `<span class="pct">${Math.round(pct)}%</span> — ${completed} of ${planned} planned sessions completed`;
    }
  }

  plannedInput.addEventListener('input', updateConsistency);
  completedInput.addEventListener('input', updateConsistency);

  // Weekly Energy Trend
  const energyLabels = ["Drained", "Low", "Steady", "Good", "Energised"];
  let startVal = null;
  let endVal = null;

  function buildEnergyScale(containerId, onSelect) {
    const el = document.getElementById(containerId);
    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.addEventListener('click', () => {
        el.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        onSelect(i);
      });
      el.appendChild(btn);
    }
  }

  function updateEnergyResult() {
    const resultEl = document.getElementById('energyResult');
    if (startVal === null || endVal === null) {
      resultEl.classList.add('empty');
      resultEl.textContent = "Rate both to see how your energy moved";
      return;
    }
    resultEl.classList.remove('empty');
    const diff = endVal - startVal;
    if (diff > 0) {
      resultEl.textContent = `Building momentum — ${energyLabels[startVal - 1]} → ${energyLabels[endVal - 1]}`;
    } else if (diff < 0) {
      resultEl.textContent = `The week wore you down — ${energyLabels[startVal - 1]} → ${energyLabels[endVal - 1]}. Worth checking your Recovery Plan below.`;
    } else {
      resultEl.textContent = `Steady all week — held at ${energyLabels[endVal - 1]}`;
    }
  }

  buildEnergyScale('startScale', (v) => { startVal = v; updateEnergyResult(); });
  buildEnergyScale('endScale', (v) => { endVal = v; updateEnergyResult(); });
</script>

</body>
</html>
