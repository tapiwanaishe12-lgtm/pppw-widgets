<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vehicle Running Cost Calculator</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 460px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 18px; line-height: 1.4; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ppw-muted);
    margin: 14px 0 10px 0;
  }
  .section-label:first-of-type { margin-top: 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .field .input-wrap { position: relative; }
  .field .input-wrap span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ppw-muted);
    font-size: 14px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .field .input-wrap input { padding-left: 24px; }
  .field input:focus { outline: none; border-color: var(--ppw-green); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 6px 0 16px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .snapshot-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .snapshot-num { font-size: 20px; font-weight: 800; color: var(--ppw-green-dark); line-height: 1.1; }
  .snapshot-label { font-size: 10px; color: var(--ppw-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    background: var(--ppw-green-light);
    border-radius: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Vehicle Running Cost Calculator</h1>
  <div class="desc">Combine fuel efficiency and fixed costs to see what your car actually costs per mile and per month — not just what fuel alone costs.</div>

  <div class="section-label">Fuel</div>
  <div class="field">
    <label for="mpg">Fuel economy (miles per gallon)</label>
    <input type="number" id="mpg" placeholder="e.g. 45" min="0" step="0.1">
  </div>
  <div class="field">
    <label for="fuelPrice">Fuel price (per litre)</label>
    <div class="input-wrap">
      <span>£</span>
      <input type="number" id="fuelPrice" placeholder="e.g. 1.45" min="0" step="0.01">
    </div>
  </div>
  <div class="field">
    <label for="monthlyMiles">Monthly mileage</label>
    <input type="number" id="monthlyMiles" placeholder="e.g. 800" min="0" step="1">
  </div>

  <div class="section-label">Fixed Monthly Costs</div>
  <div class="field">
    <label for="fixedCosts">Insurance + tax + finance (monthly total)</label>
    <div class="input-wrap">
      <span>£</span>
      <input type="number" id="fixedCosts" placeholder="e.g. 180" min="0" step="1">
    </div>
  </div>

  <button class="primary" id="calcBtn">Calculate Running Cost</button>

  <div class="result" id="resultBox">
    <div class="snapshot-row">
      <div class="snapshot-box">
        <div class="snapshot-num" id="costPerMile">£0.00</div>
        <div class="snapshot-label">Cost Per Mile</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="monthlyCost">£0</div>
        <div class="snapshot-label">Per Month</div>
      </div>
    </div>
    <div class="note" id="noteBox"></div>
  </div>
</div>

<script>
(function() {
  const LITRES_PER_GALLON = 4.546;

  document.getElementById('calcBtn').addEventListener('click', () => {
    const mpg = parseFloat(document.getElementById('mpg').value) || 0;
    const fuelPrice = parseFloat(document.getElementById('fuelPrice').value) || 0;
    const monthlyMiles = parseFloat(document.getElementById('monthlyMiles').value) || 0;
    const fixedCosts = parseFloat(document.getElementById('fixedCosts').value) || 0;

    const resultBox = document.getElementById('resultBox');
    const noteBox = document.getElementById('noteBox');

    if (mpg === 0 || fuelPrice === 0) {
      document.getElementById('costPerMile').textContent = '£0.00';
      document.getElementById('monthlyCost').textContent = '£0';
      noteBox.textContent = 'Add fuel economy and fuel price to calculate.';
      resultBox.classList.add('show');
      return;
    }

    const costPerGallon = fuelPrice * LITRES_PER_GALLON;
    const fuelCostPerMile = costPerGallon / mpg;
    const monthlyFuelCost = fuelCostPerMile * monthlyMiles;
    const totalMonthlyCost = monthlyFuelCost + fixedCosts;
    const totalCostPerMile = monthlyMiles > 0 ? totalMonthlyCost / monthlyMiles : fuelCostPerMile;

    document.getElementById('costPerMile').textContent = '£' + totalCostPerMile.toFixed(2);
    document.getElementById('monthlyCost').textContent = '£' + Math.round(totalMonthlyCost).toLocaleString('en-GB');

    if (monthlyMiles === 0) {
      noteBox.textContent = `Fuel alone costs £${fuelCostPerMile.toFixed(2)} per mile. Add monthly mileage to see your full monthly running cost.`;
    } else {
      noteBox.textContent = `£${Math.round(monthlyFuelCost)} in fuel plus £${Math.round(fixedCosts)} in fixed costs this month, across ${monthlyMiles} miles.`;
    }

    resultBox.classList.add('show');
  });
})();
</script>

</body>
</html>
