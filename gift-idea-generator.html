<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gift Idea Generator</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 480px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .interest-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .interest-chip {
    padding: 9px 10px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ppw-text);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }
  .interest-chip:hover { background: var(--ppw-green-light); }
  .interest-chip.selected {
    background: var(--ppw-green);
    border-color: var(--ppw-green);
    color: #fff;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .idea-block { margin-bottom: 12px; }
  .idea-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ppw-green-dark);
    background: var(--ppw-green-light);
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .idea-items {
    font-size: 13px;
    color: var(--ppw-text);
    line-height: 1.7;
    padding-left: 6px;
  }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Gift Idea Generator</h1>
  <div class="desc">Tick what this person's into — get a few gift idea prompts matched to those interests to jump-start your thinking.</div>

  <div class="interest-grid" id="interestGrid"></div>

  <button class="primary" id="generateBtn">Generate Gift Ideas</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const interestData = {
    'Cooking': ['A specialty ingredient set or spice kit', 'A cookbook from a cuisine they haven\'t tried', 'A good knife or kitchen tool upgrade', 'A cooking class or experience'],
    'Reading': ['A book from an author they mention often', 'A subscription to a book box or magazine', 'A nice bookmark or reading light', 'A voucher to their favourite bookshop'],
    'Tech': ['A useful accessory for a device they already own', 'A subscription to a tool or app they\'d actually use', 'A gadget that solves a small daily annoyance', 'Something for their desk or workspace setup'],
    'Fitness': ['A piece of kit for their specific sport or routine', 'A class pass or session with an instructor', 'Recovery gear (foam roller, quality water bottle)', 'Activewear in a brand they already like'],
    'Outdoors': ['A well-made piece of gear for their usual activity', 'A guided experience — hike, tour, or trip', 'A field guide or map for somewhere they love', 'Weatherproof gear for their setup'],
    'Music': ['Tickets to see an artist they follow', 'Vinyl or merch from a favourite artist', 'A subscription service gift card', 'An accessory for their instrument, if they play one'],
    'Art & Crafts': ['A quality set of materials for their specific medium', 'A class or workshop to learn something new', 'A piece from an artist or maker they\'d appreciate', 'A dedicated tool or organizer for their supplies'],
    'Home & Decor': ['A piece that fits a room they\'ve mentioned wanting to update', 'Something practical dressed up nicely (a good throw, planter)', 'A candle or scent in something other than the obvious', 'A small plant or something living for their space'],
    'Gaming': ['A game in a genre they already play', 'An accessory or upgrade for their setup', 'A gift card to their platform of choice', 'Merch from a game or series they love'],
    'Fashion': ['A quality basic in a colour or style they wear often', 'An accessory (scarf, bag, jewelry) rather than sizing-dependent clothing', 'A voucher to a shop they already like', 'Something seasonal for a gap in their wardrobe']
  };

  const interestGrid = document.getElementById('interestGrid');
  const selected = new Set();

  Object.keys(interestData).forEach(interest => {
    const chip = document.createElement('div');
    chip.className = 'interest-chip';
    chip.textContent = interest;
    chip.addEventListener('click', () => {
      if (selected.has(interest)) {
        selected.delete(interest);
        chip.classList.remove('selected');
      } else {
        selected.add(interest);
        chip.classList.add('selected');
      }
    });
    interestGrid.appendChild(chip);
  });

  document.getElementById('generateBtn').addEventListener('click', () => {
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    resultBox.classList.add('show');

    if (selected.size === 0) {
      resultBox.innerHTML = '<div class="note">Tick at least one interest to generate ideas.</div>';
      return;
    }

    selected.forEach(interest => {
      const block = document.createElement('div');
      block.className = 'idea-block';

      const title = document.createElement('div');
      title.className = 'idea-title';
      title.textContent = interest;

      const items = document.createElement('div');
      items.className = 'idea-items';
      items.innerHTML = interestData[interest].map(i => '• ' + i).join('<br>');

      block.appendChild(title);
      block.appendChild(items);
      resultBox.appendChild(block);
    });

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Starting points, not final answers — the best gift usually comes from combining one of these with something specific you already know about them.';
    resultBox.appendChild(note);
  });
})();
</script>

</body>
</html>
