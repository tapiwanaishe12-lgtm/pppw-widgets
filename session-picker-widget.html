<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Session Picker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 520px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .option-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .option-btn {
    flex: 1;
    min-width: 90px;
    padding: 9px 6px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: #111827;
  }
  .option-btn:hover { border-color: #16a34a; }
  .option-btn.selected {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #16a34a;
  }

  button.pick-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.pick-btn:hover { background: #128a3e; }

  .result {
    margin-top: 22px;
    padding: 18px;
    border-radius: 10px;
    display: none;
    text-align: center;
  }
  .result.visible { display: block; }
  .result-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 8px 0;
  }
  .result-message {
    font-size: 13px;
    color: #374151;
    line-height: 1.6;
    text-align: left;
  }
  .tier-full { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .tier-moderate { background: #fffbeb; border: 1px solid #fde68a; }
  .tier-easy { background: #fef2f2; border: 1px solid #fecaca; }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Today's Session Picker</h1>
  <p class="subtitle">Combine your readiness and your most-neglected discipline into one suggestion for today.</p>

  <label>Recovery readiness today</label>
  <div class="option-row" id="readinessRow">
    <div class="option-btn" data-r="low">Low</div>
    <div class="option-btn" data-r="moderate">Moderate</div>
    <div class="option-btn" data-r="high">High</div>
  </div>

  <label>Which discipline needs attention most? (from your Balance Checker)</label>
  <div class="option-row" id="disciplineRow">
    <div class="option-btn" data-d="Running">Running</div>
    <div class="option-btn" data-d="Lifting">Lifting</div>
    <div class="option-btn" data-d="Cycling">Cycling</div>
    <div class="option-btn" data-d="Swimming">Swimming</div>
    <div class="option-btn" data-d="Cross-Training">Cross-Training</div>
  </div>

  <button class="pick-btn" onclick="pickSession()">Pick Today's Session</button>

  <div class="result" id="result">
    <p class="result-title" id="resultTitle"></p>
    <p class="result-message" id="resultMessage"></p>
  </div>
</div>

<script>
  let selectedReadiness = null;
  let selectedDiscipline = null;

  document.querySelectorAll('#readinessRow .option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#readinessRow .option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedReadiness = btn.getAttribute('data-r');
    });
  });

  document.querySelectorAll('#disciplineRow .option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#disciplineRow .option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDiscipline = btn.getAttribute('data-d');
    });
  });

  function pickSession() {
    if (!selectedReadiness || !selectedDiscipline) return;

    const result = document.getElementById('result');
    const title = document.getElementById('resultTitle');
    const message = document.getElementById('resultMessage');

    if (selectedReadiness === 'high') {
      result.className = 'result visible tier-full';
      title.textContent = "✅ Full " + selectedDiscipline + " Session";
      title.style.color = '#16a34a';
      message.textContent = "Readiness is high and " + selectedDiscipline.toLowerCase() + " needs the attention — today's a good day for a genuinely demanding session in that discipline, including pushing for a new best if one's on the table.";
    } else if (selectedReadiness === 'moderate') {
      result.className = 'result visible tier-moderate';
      title.textContent = "⚠️ Moderate " + selectedDiscipline + " Session";
      title.style.color = '#d97706';
      message.textContent = "Readiness is moderate. Still train " + selectedDiscipline.toLowerCase() + " to address the imbalance, but dial back intensity or volume by roughly 20-30% compared to a full session.";
    } else {
      result.className = 'result visible tier-easy';
      title.textContent = "🛑 Easy Session or Active Recovery";
      title.style.color = '#dc2626';
      message.textContent = "Readiness is low today. Rather than pushing " + selectedDiscipline.toLowerCase() + " hard, consider a light technique-focused session, mobility work, or genuine rest — the discipline imbalance will still be there tomorrow, but pushing through low readiness raises real injury risk.";
    }
  }
</script>

</body>
</html>
