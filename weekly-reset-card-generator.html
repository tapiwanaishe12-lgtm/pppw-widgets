<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Reset Card Generator</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 520px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .field textarea, .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
    resize: vertical;
  }
  .field textarea:focus, .field input:focus { outline: none; border-color: var(--ppw-green); }
  .rating-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .rating-btn {
    padding: 10px 4px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ppw-text);
    cursor: pointer;
    text-align: center;
  }
  .rating-btn:hover { background: var(--ppw-green-light); }
  .rating-btn.selected { background: var(--ppw-green); border-color: var(--ppw-green); color: #fff; }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 18px 0 12px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; background: var(--ppw-green-light); border-radius: 10px; padding: 18px; }
  .result.show { display: block; }
  .result h2 { font-size: 15px; margin: 0 0 4px 0; color: var(--ppw-green-dark); }
  .result .week-rating { font-size: 12px; color: var(--ppw-muted); margin-bottom: 14px; }
  .result-section { margin-bottom: 12px; font-size: 13px; line-height: 1.6; }
  .result-section:last-child { margin-bottom: 0; }
  .result-section strong { display: block; color: var(--ppw-green-dark); font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Weekly Reset Card Generator</h1>
  <div class="desc">Answer a few quick prompts — get one clean summary of the week, ready to save or screenshot before you move into the next one.</div>

  <div class="field">
    <label>Overall, how did this week go? (1–5)</label>
    <div class="rating-grid" id="ratingGrid">
      <button class="rating-btn" data-val="1">1</button>
      <button class="rating-btn" data-val="2">2</button>
      <button class="rating-btn" data-val="3">3</button>
      <button class="rating-btn" data-val="4">4</button>
      <button class="rating-btn" data-val="5">5</button>
    </div>
  </div>

  <div class="field">
    <label for="wins">Wins this week</label>
    <textarea id="wins" rows="2" placeholder="What actually went well?"></textarea>
  </div>

  <div class="field">
    <label for="challenge">Biggest challenge</label>
    <textarea id="challenge" rows="2" placeholder="What was hardest, or didn't go to plan?"></textarea>
  </div>

  <div class="field">
    <label for="lesson">One thing to carry forward</label>
    <textarea id="lesson" rows="2" placeholder="A lesson, adjustment, or reminder for next week"></textarea>
  </div>

  <div class="field">
    <label for="focus">Next week's focus</label>
    <textarea id="focus" rows="2" placeholder="What matters most next week?"></textarea>
  </div>

  <button class="primary" id="generateBtn">Generate My Weekly Reset</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  let selectedRating = null;
  const ratingGrid = document.getElementById('ratingGrid');

  ratingGrid.querySelectorAll('.rating-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      ratingGrid.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedRating = btn.dataset.val;
    });
  });

  document.getElementById('generateBtn').addEventListener('click', () => {
    const resultBox = document.getElementById('resultBox');
    resultBox.classList.add('show');

    const wins = document.getElementById('wins').value.trim();
    const challenge = document.getElementById('challenge').value.trim();
    const lesson = document.getElementById('lesson').value.trim();
    const focus = document.getElementById('focus').value.trim();

    const today = new Date();
    const dateStr = today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    let html = `<h2>Weekly Reset — ${dateStr}</h2>`;
    html += `<div class="week-rating">${selectedRating ? `Week rating: ${selectedRating}/5` : 'Week rating: not set'}</div>`;

    html += `<div class="result-section"><strong>Wins</strong>${wins || 'Nothing logged yet.'}</div>`;
    html += `<div class="result-section"><strong>Biggest Challenge</strong>${challenge || 'Nothing logged yet.'}</div>`;
    html += `<div class="result-section"><strong>Carrying Forward</strong>${lesson || 'Nothing logged yet.'}</div>`;
    html += `<div class="result-section"><strong>Next Week's Focus</strong>${focus || 'Nothing logged yet.'}</div>`;

    resultBox.innerHTML = html;
  });
})();
</script>

</body>
</html>
