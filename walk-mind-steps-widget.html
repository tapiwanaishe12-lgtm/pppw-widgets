<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Clarity & Step Goal</title>
<style>
  :root {
    --green: #16a34a;
    --green-dark: #15803d;
    --green-light: #dcfce7;
    --black: #111111;
    --white: #ffffff;
    --gray: #6b7280;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--black);
    padding: 20px;
  }

  .widget {
    max-width: 560px;
    margin: 0 auto;
  }

  .section {
    margin-bottom: 26px;
  }

  .section:last-child {
    margin-bottom: 0;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h2 {
    margin: 0 0 4px 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--black);
  }

  .header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--gray);
  }

  /* Mind Clarity Section */
  .clarity-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .clarity-label {
    width: 56px;
    font-size: 12px;
    font-weight: 700;
    color: var(--gray);
    flex-shrink: 0;
  }

  .clarity-scale {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .clarity-scale button {
    aspect-ratio: 1 / 1;
    border-radius: 7px;
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--black);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }

  .clarity-scale button:hover {
    border-color: var(--green);
  }

  .clarity-scale button.selected {
    background: var(--green);
    border-color: var(--green-dark);
    color: var(--white);
    transform: scale(1.06);
  }

  .clarity-result {
    background: var(--green-light);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
    font-size: 13px;
    color: var(--green-dark);
    font-weight: 700;
    min-height: 20px;
  }

  .clarity-result.empty {
    color: var(--gray);
    font-weight: 500;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  /* Step Goal Section */
  .step-inputs {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .step-inputs .field {
    flex: 1;
  }

  .step-inputs label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 5px;
  }

  .step-inputs input {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--black);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .step-inputs input:focus {
    border-color: var(--green);
  }

  .progress-track {
    width: 100%;
    height: 22px;
    background: #f3f4f6;
    border-radius: 11px;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 11px 0 0 11px;
  }

  .progress-text {
    text-align: center;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--gray);
    font-weight: 600;
  }

  .progress-text .pct {
    color: var(--green-dark);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="widget">

  <div class="section">
    <div class="header">
      <h2>🧠 Mind Clarity Check-In</h2>
      <p>No watch measures this. Rate how your head felt before and after.</p>
    </div>

    <div class="clarity-row">
      <div class="clarity-label">Before</div>
      <div class="clarity-scale" id="beforeScale"></div>
    </div>
    <div class="clarity-row">
      <div class="clarity-label">After</div>
      <div class="clarity-scale" id="afterScale"></div>
    </div>

    <div class="clarity-result empty" id="clarityResult">
      Rate before and after to see the shift
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="header">
      <h2>👣 Step Goal Progress</h2>
      <p>Enter your target and today's steps — watch the bar fill.</p>
    </div>

    <div class="step-inputs">
      <div class="field">
        <label for="stepGoal">Daily Goal</label>
        <input type="number" id="stepGoal" placeholder="e.g. 10000" min="0">
      </div>
      <div class="field">
        <label for="stepActual">Steps So Far</label>
        <input type="number" id="stepActual" placeholder="e.g. 6400" min="0">
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">Enter your goal and steps to see progress</div>
  </div>

</div>

<script>
  // Mind Clarity
  const clarityLabels = ["Very Foggy", "A Bit Foggy", "Neutral", "Fairly Clear", "Very Clear"];
  let beforeVal = null;
  let afterVal = null;

  function buildScale(containerId, onSelect) {
    const el = document.getElementById(containerId);
    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.addEventListener('click', () => {
        el.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        onSelect(i);
      });
      el.appendChild(btn);
    }
  }

  function updateClarityResult() {
    const resultEl = document.getElementById('clarityResult');
    if (beforeVal === null || afterVal === null) {
      resultEl.classList.add('empty');
      resultEl.textContent = "Rate before and after to see the shift";
      return;
    }
    resultEl.classList.remove('empty');
    const diff = afterVal - beforeVal;
    if (diff > 0) {
      resultEl.textContent = `Head cleared by ${diff} point${diff > 1 ? 's' : ''} — ${clarityLabels[beforeVal - 1]} → ${clarityLabels[afterVal - 1]}`;
    } else if (diff < 0) {
      resultEl.textContent = `Feeling foggier than before — ${clarityLabels[beforeVal - 1]} → ${clarityLabels[afterVal - 1]}`;
    } else {
      resultEl.textContent = `No change — steady at ${clarityLabels[afterVal - 1]}`;
    }
  }

  buildScale('beforeScale', (v) => { beforeVal = v; updateClarityResult(); });
  buildScale('afterScale', (v) => { afterVal = v; updateClarityResult(); });

  // Step Goal Progress
  const goalInput = document.getElementById('stepGoal');
  const actualInput = document.getElementById('stepActual');
  const fillEl = document.getElementById('progressFill');
  const textEl = document.getElementById('progressText');

  function updateProgress() {
    const goal = parseFloat(goalInput.value);
    const actual = parseFloat(actualInput.value);

    if (!goal || goal <= 0 || isNaN(actual) || actual < 0) {
      fillEl.style.width = '0%';
      textEl.textContent = "Enter your goal and steps to see progress";
      return;
    }

    const pct = Math.min((actual / goal) * 100, 100);
    fillEl.style.width = pct + '%';

    if (actual >= goal) {
      textEl.innerHTML = `<span class="pct">Goal hit!</span> ${actual.toLocaleString()} / ${goal.toLocaleString()} steps`;
    } else {
      textEl.innerHTML = `<span class="pct">${Math.round(pct)}%</span> of goal — ${actual.toLocaleString()} / ${goal.toLocaleString()} steps`;
    }
  }

  goalInput.addEventListener('input', updateProgress);
  actualInput.addEventListener('input', updateProgress);
</script>

</body>
</html>
