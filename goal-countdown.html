<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goal Countdown</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 420px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px 0;
  }
  .desc {
    font-size: 13px;
    color: var(--ppw-muted);
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ppw-text);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .field input:focus {
    outline: none;
    border-color: var(--ppw-green);
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 6px 0 16px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result {
    display: none;
  }
  .result.show { display: block; }
  .result-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ppw-green-dark);
    margin-bottom: 10px;
    text-align: center;
  }
  .countdown-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    margin-bottom: 10px;
  }
  .countdown-num {
    font-size: 34px;
    font-weight: 800;
    color: var(--ppw-green-dark);
    line-height: 1;
  }
  .countdown-label {
    font-size: 11px;
    color: var(--ppw-muted);
    margin-top: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--ppw-green-light);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--ppw-green);
    border-radius: 4px;
    transition: width 0.2s ease;
  }
  .progress-caption {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Goal Countdown</h1>
  <div class="desc">Enter your goal and its target date to see how much runway is left.</div>

  <div class="field">
    <label for="goalName">Goal name (optional)</label>
    <input type="text" id="goalName" placeholder="e.g. Save £2,000 emergency fund">
  </div>

  <div class="field">
    <label for="startDate">When did you set this goal?</label>
    <input type="date" id="startDate">
  </div>

  <div class="field">
    <label for="targetDate">Target date</label>
    <input type="date" id="targetDate">
  </div>

  <button class="primary" id="showBtn">Show My Countdown</button>

  <div class="result" id="resultBox">
    <div class="result-title" id="resultTitle"></div>
    <div class="countdown-box">
      <div class="countdown-num" id="daysLeft">0</div>
      <div class="countdown-label">Days Remaining</div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%;"></div>
    </div>
    <div class="progress-caption" id="progressCaption"></div>
  </div>
</div>

<script>
(function() {
  const goalNameEl = document.getElementById('goalName');
  const startDateEl = document.getElementById('startDate');
  const targetDateEl = document.getElementById('targetDate');
  const resultBox = document.getElementById('resultBox');
  const resultTitle = document.getElementById('resultTitle');
  const daysLeftEl = document.getElementById('daysLeft');
  const progressFill = document.getElementById('progressFill');
  const progressCaption = document.getElementById('progressCaption');

  const todayStr = new Date().toISOString().slice(0,10);
  targetDateEl.value = todayStr;
  startDateEl.value = todayStr;

  document.getElementById('showBtn').addEventListener('click', () => {
    if (!targetDateEl.value) return;

    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(targetDateEl.value + 'T00:00:00');
    const start = startDateEl.value ? new Date(startDateEl.value + 'T00:00:00') : today;

    const msPerDay = 86400000;
    const daysLeft = Math.round((target - today) / msPerDay);
    const totalSpan = Math.max(1, Math.round((target - start) / msPerDay));
    const elapsed = Math.round((today - start) / msPerDay);
    let pct = Math.round((elapsed / totalSpan) * 100);
    pct = Math.max(0, Math.min(100, pct));

    const name = goalNameEl.value.trim();
    resultTitle.textContent = name ? name : 'Your Goal';

    if (daysLeft < 0) {
      daysLeftEl.textContent = Math.abs(daysLeft);
      document.querySelector('.countdown-label').textContent = 'Days Past Target';
      progressFill.style.width = '100%';
      progressCaption.textContent = 'Target date has passed — worth deciding whether to reset it or mark this done.';
    } else if (daysLeft === 0) {
      daysLeftEl.textContent = '0';
      document.querySelector('.countdown-label').textContent = 'Days Remaining';
      progressFill.style.width = '100%';
      progressCaption.textContent = 'Today is the day.';
    } else {
      daysLeftEl.textContent = daysLeft;
      document.querySelector('.countdown-label').textContent = 'Days Remaining';
      progressFill.style.width = pct + '%';
      progressCaption.textContent = `${pct}% of the way through your goal window.`;
    }

    resultBox.classList.add('show');
  });
})();
</script>

</body>
</html>
