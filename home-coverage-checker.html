<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Coverage Checker</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 460px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--ppw-border);
  }
  .item-row:last-of-type { border-bottom: none; }
  .checkbox {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border: 1.5px solid var(--ppw-border);
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .checkbox.checked { background: var(--ppw-green); border-color: var(--ppw-green); }
  .checkbox.checked::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 700; }
  .item-row input[type="text"] {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
    padding: 4px 0;
  }
  .item-row input[type="text"]:focus { outline: none; }
  .item-row.checked input[type="text"] { color: var(--ppw-muted); text-decoration: line-through; }
  .remove-btn {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 5px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 13px;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .add-btn {
    width: 100%;
    padding: 8px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 8px;
    color: var(--ppw-green-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 10px 0 16px 0;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .progress-track {
    width: 100%;
    height: 10px;
    background: var(--ppw-green-light);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--ppw-green);
    border-radius: 5px;
    transition: width 0.2s ease;
  }
  .progress-caption {
    font-size: 14px;
    font-weight: 700;
    color: var(--ppw-green-dark);
    text-align: center;
    margin-bottom: 10px;
  }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    background: var(--ppw-green-light);
    border-radius: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Home Coverage Checker</h1>
  <div class="desc">List the rooms or areas in your home, tick off what you've handled this cleaning cycle, and see how much of the home is actually covered.</div>

  <div id="rows"></div>
  <button class="add-btn" id="addBtn">+ Add another room/area</button>

  <button class="primary" id="checkBtn">Check My Coverage</button>

  <div class="result" id="resultBox">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%;"></div>
    </div>
    <div class="progress-caption" id="progressCaption"></div>
    <div class="note" id="noteBox"></div>
  </div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('rows');
  const defaults = ['Kitchen', 'Bathroom(s)', 'Bedrooms', 'Living Room', 'Garden/Outdoor', 'Garage/Utility'];

  function addRow(name = '') {
    const row = document.createElement('div');
    row.className = 'item-row';

    const box = document.createElement('div');
    box.className = 'checkbox';
    box.addEventListener('click', () => {
      box.classList.toggle('checked');
      row.classList.toggle('checked');
    });

    const input = document.createElement('input');
    input.type = 'text';
    input.value = name;
    input.placeholder = 'e.g. Hallway';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(box);
    row.appendChild(input);
    row.appendChild(removeBtn);
    rowsEl.appendChild(row);
  }

  defaults.forEach(addRow);
  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('checkBtn').addEventListener('click', () => {
    const rows = Array.from(rowsEl.querySelectorAll('.item-row'))
      .filter(row => row.querySelector('input').value.trim() !== '');

    const total = rows.length;
    const done = rows.filter(row => row.classList.contains('checked'));
    const pct = total > 0 ? Math.round((done.length / total) * 100) : 0;

    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressCaption').textContent = `${pct}% of the home covered this cycle`;

    const noteBox = document.getElementById('noteBox');
    if (total === 0) {
      noteBox.textContent = 'Add at least one room or area to check coverage.';
    } else if (done.length === total) {
      noteBox.textContent = 'Every area covered this cycle — nothing left untouched.';
    } else {
      const remaining = rows.filter(row => !row.classList.contains('checked')).map(row => row.querySelector('input').value.trim());
      noteBox.textContent = `Still to cover: ${remaining.join(', ')}.`;
    }

    document.getElementById('resultBox').classList.add('show');
  });
})();
</script>

</body>
</html>
