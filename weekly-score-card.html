<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Score Card</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 420px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px 0;
  }
  .desc {
    font-size: 13px;
    color: var(--ppw-muted);
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .row {
    padding: 12px 0;
    border-bottom: 1px solid var(--ppw-border);
  }
  .row:last-of-type { border-bottom: none; }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-label {
    font-size: 14px;
    font-weight: 600;
  }
  .row-score {
    font-size: 13px;
    font-weight: 700;
    color: var(--ppw-green-dark);
  }
  .scale {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .scale button {
    padding: 8px 0;
    border: 1px solid var(--ppw-border);
    background: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ppw-text);
    cursor: pointer;
  }
  .scale button:hover { background: var(--ppw-green-light); }
  .scale button.selected {
    background: var(--ppw-green);
    border-color: var(--ppw-green);
    color: #fff;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 18px 0 12px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result {
    display: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.4;
  }
  .result.show { display: block; }
  .result.balanced {
    background: var(--ppw-green-light);
    color: var(--ppw-green-dark);
  }
  .result.flag {
    background: var(--ppw-amber-light);
    color: var(--ppw-amber);
  }
  .result strong { display: block; margin-bottom: 3px; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Weekly Score Card</h1>
  <div class="desc">Rate how this week went for each category — 1 = neglected, 5 = fully on top of it.</div>

  <div id="rows"></div>

  <button class="primary" id="scoreBtn">Get My Weekly Score</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const categories = ['Finance', 'Work', 'Home', 'Personal'];
  const scores = {};

  const rowsEl = document.getElementById('rows');

  categories.forEach(cat => {
    const row = document.createElement('div');
    row.className = 'row';

    const top = document.createElement('div');
    top.className = 'row-top';

    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = cat;

    const scoreDisplay = document.createElement('div');
    scoreDisplay.className = 'row-score';
    scoreDisplay.id = 'score-' + cat;
    scoreDisplay.textContent = '–';

    top.appendChild(label);
    top.appendChild(scoreDisplay);

    const scale = document.createElement('div');
    scale.className = 'scale';

    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.addEventListener('click', () => {
        scores[cat] = i;
        scoreDisplay.textContent = i + ' / 5';
        scale.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      scale.appendChild(btn);
    }

    row.appendChild(top);
    row.appendChild(scale);
    rowsEl.appendChild(row);
  });

  document.getElementById('scoreBtn').addEventListener('click', () => {
    const resultBox = document.getElementById('resultBox');
    const rated = categories.filter(c => scores[c] !== undefined);

    if (rated.length < categories.length) {
      resultBox.className = 'result show flag';
      const missing = categories.filter(c => scores[c] === undefined);
      resultBox.innerHTML = `<strong>Rate every category first</strong>Still need a score for ${missing.join(' & ')} before I can flag your lowest.`;
      return;
    }

    const min = Math.min(...categories.map(c => scores[c]));
    const lowestCats = categories.filter(c => scores[c] === min);
    const avg = (categories.reduce((sum, c) => sum + scores[c], 0) / categories.length).toFixed(1);

    if (min <= 2) {
      resultBox.className = 'result show flag';
      resultBox.innerHTML = `<strong>${lowestCats.join(' & ')} scored lowest (${min}/5)</strong>Average across all four: ${avg}/5. Worth making ${lowestCats.join(' & ')} the priority next week.`;
    } else {
      resultBox.className = 'result show balanced';
      resultBox.innerHTML = `<strong>Solid week — average ${avg}/5</strong>${lowestCats.join(' & ')} scored the lowest (${min}/5), but nothing's badly neglected.`;
    }
  });
})();
</script>

</body>
</html>
