<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milestone Tracker & Mindset Check-In</title>
<style>
  :root {
    --green: #16a34a;
    --green-dark: #15803d;
    --green-light: #dcfce7;
    --black: #111111;
    --white: #ffffff;
    --gray: #6b7280;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--black);
    padding: 20px;
  }

  .widget {
    max-width: 560px;
    margin: 0 auto;
  }

  .section {
    margin-bottom: 28px;
  }

  .section:last-child {
    margin-bottom: 0;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h2 {
    margin: 0 0 4px 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--black);
  }

  .header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--gray);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 26px 0;
  }

  /* Milestone Tracker */
  .progress-track {
    width: 100%;
    height: 22px;
    background: #f3f4f6;
    border-radius: 11px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 6px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 11px 0 0 11px;
  }

  .progress-text {
    text-align: center;
    font-size: 12.5px;
    color: var(--gray);
    font-weight: 600;
    margin-bottom: 16px;
  }

  .progress-text .pct {
    color: var(--green-dark);
    font-weight: 700;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 0;
    cursor: pointer;
    user-select: none;
  }

  .item .box {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    margin-top: 1px;
    border: 2px solid var(--border);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }

  .item.checked .box {
    background: var(--green);
    border-color: var(--green-dark);
  }

  .item.checked .box::after {
    content: "✓";
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
  }

  .item span.label {
    font-size: 13px;
    line-height: 1.4;
    color: var(--black);
    transition: color 0.15s ease;
    flex: 1;
  }

  .item.checked span.label {
    color: var(--gray);
    text-decoration: line-through;
  }

  .item .remove-btn {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .item:hover .remove-btn {
    opacity: 1;
  }

  .add-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }

  .add-row input {
    flex: 1;
    min-width: 0;
    border: 2px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--black);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .add-row input:focus {
    border-color: var(--green);
  }

  .add-row button {
    background: var(--green);
    color: var(--white);
    border: none;
    border-radius: 7px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .add-row button:hover {
    background: var(--green-dark);
  }

  /* Mindset Check-In */
  .rating-row {
    margin-bottom: 18px;
  }

  .rating-row:last-child {
    margin-bottom: 0;
  }

  .rating-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--black);
    margin-bottom: 8px;
  }

  .rating-scale {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }

  .rating-scale button {
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--black);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }

  .rating-scale button:hover {
    border-color: var(--green);
  }

  .rating-scale button.selected {
    background: var(--green);
    border-color: var(--green-dark);
    color: var(--white);
    transform: scale(1.08);
  }

  .rating-result {
    font-size: 12.5px;
    color: var(--gray);
    font-weight: 600;
  }

  .rating-result .val {
    color: var(--green-dark);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="widget">

  <div class="section">
    <div class="header">
      <h2>🏆 Milestone Tracker</h2>
      <p>Break your big goal into checkpoints. Tick them off as you go.</p>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="milestoneFill"></div>
    </div>
    <div class="progress-text" id="milestoneText">0 of 9 milestones hit</div>

    <div id="milestoneList"></div>

    <div class="add-row">
      <input type="text" id="milestoneInput" placeholder="Add your own milestone...">
      <button id="addMilestoneBtn">Add</button>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="header">
      <h2>🧠 Mindset Check-In</h2>
      <p>Rate honestly. This matters as much as the training itself.</p>
    </div>

    <div class="rating-row">
      <div class="rating-label">Confidence In Your Training Right Now</div>
      <div class="rating-scale" id="confidenceScale"></div>
      <div class="rating-result" id="confidenceResult">Not rated yet</div>
    </div>

    <div class="rating-row">
      <div class="rating-label">Discipline Score This Week</div>
      <div class="rating-scale" id="disciplineScale"></div>
      <div class="rating-result" id="disciplineResult">Not rated yet</div>
    </div>
  </div>

</div>

<script>
  // Milestone Tracker
  const defaultMilestones = [
    "Run 5K Under 25:00",
    "Run 10K Under 52:00",
    "Complete A 15K Long Run",
    "Hit 40km Weekly Volume",
    "Maintain 5:00/km Pace For 10km",
    "Complete A Half Marathon Distance In Training",
    "Run 3 Times Per Week For 4 Consecutive Weeks",
    "Complete A Tune-Up Race",
    "Cross The Finish Line"
  ];

  const milestoneList = document.getElementById('milestoneList');
  const milestoneFill = document.getElementById('milestoneFill');
  const milestoneText = document.getElementById('milestoneText');
  const milestoneInput = document.getElementById('milestoneInput');
  const addMilestoneBtn = document.getElementById('addMilestoneBtn');

  let totalMilestones = 0;
  let checkedMilestones = 0;

  function makeMilestoneItem(label) {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<div class="box"></div><span class="label">${label}</span><button class="remove-btn" title="Remove">✕</button>`;

    item.querySelector('.box').addEventListener('click', () => {
      const wasChecked = item.classList.contains('checked');
      item.classList.toggle('checked');
      checkedMilestones += wasChecked ? -1 : 1;
      updateMilestoneProgress();
    });
    item.querySelector('.label').addEventListener('click', () => item.querySelector('.box').click());

    item.querySelector('.remove-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (item.classList.contains('checked')) checkedMilestones -= 1;
      totalMilestones -= 1;
      item.remove();
      updateMilestoneProgress();
    });

    return item;
  }

  defaultMilestones.forEach(label => {
    totalMilestones += 1;
    milestoneList.appendChild(makeMilestoneItem(label));
  });

  function updateMilestoneProgress() {
    const pct = totalMilestones > 0 ? Math.round((checkedMilestones / totalMilestones) * 100) : 0;
    milestoneFill.style.width = pct + '%';
    if (totalMilestones > 0 && checkedMilestones === totalMilestones) {
      milestoneText.innerHTML = `<span class="pct">100%</span> — every milestone hit 🌿`;
    } else {
      milestoneText.innerHTML = `<span class="pct">${pct}%</span> — ${checkedMilestones} of ${totalMilestones} milestones hit`;
    }
  }

  function addMilestone() {
    const text = milestoneInput.value.trim();
    if (!text) return;
    totalMilestones += 1;
    milestoneList.appendChild(makeMilestoneItem(text));
    updateMilestoneProgress();
    milestoneInput.value = '';
    milestoneInput.focus();
  }

  addMilestoneBtn.addEventListener('click', addMilestone);
  milestoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addMilestone();
  });

  updateMilestoneProgress();

  // Mindset Check-In
  const confidenceLabels = ["Very Low", "Low", "Shaky", "Uncertain", "Okay", "Fairly Good", "Good", "Strong", "Very Strong", "Total Belief"];
  const disciplineLabels = ["Barely Showed Up", "Struggled", "Inconsistent", "Patchy", "Okay", "Decent", "Solid", "Strong", "Very Disciplined", "Locked In"];

  function buildRatingScale(containerId, resultId, labels, name) {
    const el = document.getElementById(containerId);
    const resultEl = document.getElementById(resultId);
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.addEventListener('click', () => {
        el.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        resultEl.innerHTML = `<span class="val">${i}/10</span> — ${labels[i - 1]}`;
      });
      el.appendChild(btn);
    }
  }

  buildRatingScale('confidenceScale', 'confidenceResult', confidenceLabels, 'confidence');
  buildRatingScale('disciplineScale', 'disciplineResult', disciplineLabels, 'discipline');
</script>

</body>
</html>
