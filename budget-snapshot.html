<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Budget Snapshot Calculator</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 460px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 18px; line-height: 1.4; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .field .input-wrap {
    position: relative;
  }
  .field .input-wrap span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ppw-muted);
    font-size: 14px;
  }
  .field input {
    width: 100%;
    padding: 9px 12px 9px 24px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .field input:focus { outline: none; border-color: var(--ppw-green); }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ppw-muted);
    margin: 16px 0 10px 0;
  }
  .expense-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 18px 0 12px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .snapshot-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
  }
  .snapshot-num {
    font-size: 18px;
    font-weight: 800;
    color: var(--ppw-green-dark);
    line-height: 1.1;
  }
  .snapshot-label {
    font-size: 10px;
    color: var(--ppw-muted);
    margin-top: 3px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .verdict {
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.4;
  }
  .verdict.balanced { background: var(--ppw-green-light); color: var(--ppw-green-dark); }
  .verdict.flag { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .verdict strong { display: block; margin-bottom: 3px; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Budget Snapshot Calculator</h1>
  <div class="desc">Enter your income and expenses by category — see your total in, total out, and what's left, without doing the maths yourself.</div>

  <div class="field">
    <label for="income">Monthly income</label>
    <div class="input-wrap">
      <span>£</span>
      <input type="number" id="income" placeholder="0" min="0" step="0.01">
    </div>
  </div>

  <div class="section-label">Expenses</div>
  <div class="expense-grid" id="expenseGrid"></div>

  <button class="primary" id="calcBtn">Calculate My Snapshot</button>

  <div class="result" id="resultBox">
    <div class="snapshot-row">
      <div class="snapshot-box">
        <div class="snapshot-num" id="totalIn">£0</div>
        <div class="snapshot-label">Total In</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="totalOut">£0</div>
        <div class="snapshot-label">Total Out</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="leftOver">£0</div>
        <div class="snapshot-label">Left Over</div>
      </div>
    </div>
    <div class="verdict" id="verdictBox"></div>
  </div>
</div>

<script>
(function() {
  const categories = ['Housing', 'Bills & Subscriptions', 'Groceries', 'Transport', 'Debt Payments', 'Savings', 'Personal', 'Other'];
  const grid = document.getElementById('expenseGrid');
  const inputs = {};

  categories.forEach(cat => {
    const field = document.createElement('div');
    field.className = 'field';

    const label = document.createElement('label');
    label.textContent = cat;

    const wrap = document.createElement('div');
    wrap.className = 'input-wrap';

    const span = document.createElement('span');
    span.textContent = '£';

    const input = document.createElement('input');
    input.type = 'number';
    input.placeholder = '0';
    input.min = '0';
    input.step = '0.01';

    inputs[cat] = input;
    wrap.appendChild(span);
    wrap.appendChild(input);
    field.appendChild(label);
    field.appendChild(wrap);
    grid.appendChild(field);
  });

  document.getElementById('calcBtn').addEventListener('click', () => {
    const income = parseFloat(document.getElementById('income').value) || 0;
    let totalExpenses = 0;
    categories.forEach(cat => {
      totalExpenses += parseFloat(inputs[cat].value) || 0;
    });

    const leftOver = income - totalExpenses;
    const savingsInput = parseFloat(inputs['Savings'].value) || 0;
    const savingsRate = income > 0 ? Math.round((savingsInput / income) * 100) : 0;

    document.getElementById('totalIn').textContent = '£' + income.toLocaleString('en-GB', {maximumFractionDigits: 0});
    document.getElementById('totalOut').textContent = '£' + totalExpenses.toLocaleString('en-GB', {maximumFractionDigits: 0});
    document.getElementById('leftOver').textContent = '£' + leftOver.toLocaleString('en-GB', {maximumFractionDigits: 0});

    const verdictBox = document.getElementById('verdictBox');
    if (income === 0) {
      verdictBox.className = 'verdict flag';
      verdictBox.innerHTML = '<strong>Add your income first</strong>Enter your monthly income above to see a full snapshot.';
    } else if (leftOver < 0) {
      verdictBox.className = 'verdict flag';
      verdictBox.innerHTML = `<strong>Spending more than you're earning this month</strong>You're £${Math.abs(leftOver).toLocaleString('en-GB', {maximumFractionDigits: 0})} over. Worth checking which category moved most before next month.`;
    } else if (savingsRate < 10) {
      verdictBox.className = 'verdict flag';
      verdictBox.innerHTML = `<strong>Savings rate: ${savingsRate}%</strong>You're in the black, but savings are under 10% of income. Even a small increase compounds over a year.`;
    } else {
      verdictBox.className = 'verdict balanced';
      verdictBox.innerHTML = `<strong>Solid month — savings rate: ${savingsRate}%</strong>Income covers expenses with room to spare, and savings are in a healthy range.`;
    }

    document.getElementById('resultBox').classList.add('show');
  });
})();
</script>

</body>
</html>
