<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Non-Negotiables This Week</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 420px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px 0;
  }
  .desc {
    font-size: 13px;
    color: var(--ppw-muted);
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--ppw-border);
  }
  .item:last-of-type { border-bottom: none; }
  .checkbox {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border: 1.5px solid var(--ppw-border);
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .checkbox.checked {
    background: var(--ppw-green);
    border-color: var(--ppw-green);
  }
  .checkbox.checked::after {
    content: "✓";
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .item input[type="text"] {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
    padding: 4px 0;
  }
  .item input[type="text"]:focus { outline: none; }
  .item.checked input[type="text"] {
    color: var(--ppw-muted);
    text-decoration: line-through;
  }
  .footer-note {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    background: var(--ppw-green-light);
    border-radius: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Non-Negotiables This Week</h1>
  <div class="desc">Not everything needs to happen daily — but these do. Type in your 2-3 non-negotiables, then check them off as you go.</div>

  <div id="items"></div>

  <div class="footer-note">These reset each week. Keep the list short — that's what makes it stick.</div>
</div>

<script>
(function() {
  const itemsEl = document.getElementById('items');
  const placeholders = [
    'e.g. Check the budget every Sunday',
    'e.g. One hour of admin, weekdays',
    'e.g. No skipped meal prep'
  ];

  placeholders.forEach((ph, i) => {
    const item = document.createElement('div');
    item.className = 'item';

    const box = document.createElement('div');
    box.className = 'checkbox';
    box.addEventListener('click', () => {
      box.classList.toggle('checked');
      item.classList.toggle('checked');
    });

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = ph;

    item.appendChild(box);
    item.appendChild(input);
    itemsEl.appendChild(item);
  });
})();
</script>

</body>
</html>
