<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Household Chore Balance</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 440px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 18px; line-height: 1.4; }
  .row {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 10px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--ppw-border);
  }
  .row:last-of-type { border-bottom: none; }
  .row input[type="text"] {
    padding: 8px 10px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: var(--ppw-text);
    width: 100%;
  }
  .row input[type="text"]:focus { outline: none; border-color: var(--ppw-green); }
  .counter {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .counter button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    font-size: 14px;
    font-weight: 700;
    color: var(--ppw-green-dark);
    cursor: pointer;
    line-height: 1;
  }
  .counter button:hover { background: var(--ppw-green-light); }
  .counter .val { min-width: 16px; text-align: center; font-size: 14px; font-weight: 700; }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 18px 0 12px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.4; }
  .result.show { display: block; }
  .result.balanced { background: var(--ppw-green-light); color: var(--ppw-green-dark); }
  .result.flag { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .result strong { display: block; margin-bottom: 3px; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Household Chore Balance</h1>
  <div class="desc">How many chores or responsibilities has each person handled this week? Name each household member and count what they've done.</div>

  <div id="rows"></div>

  <button class="primary" id="checkBtn">Check The Balance</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const defaultNames = ['Person 1', 'Person 2', 'Person 3', 'Person 4'];
  const counts = [0, 0, 0, 0];
  const rowsEl = document.getElementById('rows');

  defaultNames.forEach((defaultName, i) => {
    const row = document.createElement('div');
    row.className = 'row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = defaultName;

    const counter = document.createElement('div');
    counter.className = 'counter';

    const minus = document.createElement('button');
    minus.textContent = '–';
    minus.addEventListener('click', () => {
      counts[i] = Math.max(0, counts[i] - 1);
      valEl.textContent = counts[i];
    });

    const valEl = document.createElement('div');
    valEl.className = 'val';
    valEl.textContent = '0';

    const plus = document.createElement('button');
    plus.textContent = '+';
    plus.addEventListener('click', () => {
      counts[i] = counts[i] + 1;
      valEl.textContent = counts[i];
    });

    counter.appendChild(minus);
    counter.appendChild(valEl);
    counter.appendChild(plus);

    row.appendChild(nameInput);
    row.appendChild(counter);
    rowsEl.appendChild(row);

    row.dataset.index = i;
    row._nameInput = nameInput;
  });

  document.getElementById('checkBtn').addEventListener('click', () => {
    const resultBox = document.getElementById('resultBox');
    const rows = Array.from(rowsEl.children);
    const entries = rows
      .map((row, i) => ({ name: row._nameInput.value.trim() || defaultNames[i], count: counts[i] }))
      .filter(e => e.count > 0);

    if (entries.length === 0) {
      resultBox.className = 'result show flag';
      resultBox.innerHTML = '<strong>No entries yet</strong>Add at least one chore count to check the balance.';
      return;
    }

    const total = entries.reduce((sum, e) => sum + e.count, 0);
    const max = Math.max(...entries.map(e => e.count));
    const min = Math.min(...entries.map(e => e.count));
    const topPeople = entries.filter(e => e.count === max).map(e => e.name);
    const range = max - min;

    if (entries.length === 1) {
      resultBox.className = 'result show flag';
      resultBox.innerHTML = `<strong>Only ${entries[0].name} has entries</strong>Add counts for others in the household to see a real balance check.`;
    } else if (range >= 4) {
      resultBox.className = 'result show flag';
      resultBox.innerHTML = `<strong>${topPeople.join(' & ')} carrying the most this week</strong>${total} chores logged in total, but the spread is wide — worth checking in on whether that's sustainable or just how this week landed.`;
    } else {
      resultBox.className = 'result show balanced';
      resultBox.innerHTML = `<strong>Fairly even split</strong>${total} chores logged across ${entries.length} people this week, without one person carrying a lot more than the rest.`;
    }
  });
})();
</script>

</body>
</html>
