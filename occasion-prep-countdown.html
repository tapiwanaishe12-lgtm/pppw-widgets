<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Occasion Prep Countdown</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-red-light: #fbe4e2;
    --ppw-red: #a83a2f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 520px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .col-labels {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.1fr auto;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ppw-muted);
    margin-bottom: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row input, .row select {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .row input:focus, .row select:focus { outline: none; border-color: var(--ppw-green); }
  .remove-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .add-btn {
    width: 100%;
    padding: 9px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 8px;
    color: var(--ppw-green-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 16px 0;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .status-row {
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .status-row.ok { background: var(--ppw-green-light); }
  .status-row.soon { background: var(--ppw-amber-light); }
  .status-row.overdue { background: var(--ppw-red-light); }
  .status-row .top-line {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .status-row.ok .top-line { color: var(--ppw-green-dark); }
  .status-row.soon .top-line { color: var(--ppw-amber); }
  .status-row.overdue .top-line { color: var(--ppw-red); }
  .status-row .sub-line {
    font-size: 12px;
    color: var(--ppw-muted);
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Occasion Prep Countdown</h1>
  <div class="desc">Add an occasion, its date, and how much lead time you want for gifts or prep — see not just when it's happening, but when you need to act by.</div>

  <div class="col-labels">
    <div>Occasion</div>
    <div>Date</div>
    <div>Prep Lead Time</div>
    <div></div>
  </div>
  <div id="rows"></div>

  <button class="add-btn" id="addBtn">+ Add another occasion</button>
  <button class="primary" id="checkBtn">Check My Deadlines</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('rows');
  const leadOptions = [
    { label: '1 week before', days: 7 },
    { label: '2 weeks before', days: 14 },
    { label: '1 month before', days: 30 },
    { label: '2 months before', days: 60 }
  ];

  function addRow(name = '') {
    const row = document.createElement('div');
    row.className = 'row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = "e.g. Mum's birthday";
    nameInput.value = name;

    const dateInput = document.createElement('input');
    dateInput.type = 'date';

    const leadSelect = document.createElement('select');
    leadOptions.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.label;
      o.textContent = opt.label;
      leadSelect.appendChild(o);
    });
    leadSelect.value = '2 weeks before';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(nameInput);
    row.appendChild(dateInput);
    row.appendChild(leadSelect);
    row.appendChild(removeBtn);
    rowsEl.appendChild(row);
  }

  ['', ''].forEach(addRow);
  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('checkBtn').addEventListener('click', () => {
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    resultBox.classList.add('show');

    const today = new Date();
    today.setHours(0,0,0,0);
    let anyEntries = false;

    const entries = [];

    rowsEl.querySelectorAll('.row').forEach(row => {
      const name = row.children[0].value.trim();
      const dateStr = row.children[1].value;
      const leadLabel = row.children[2].value;

      if (!name || !dateStr) return;
      anyEntries = true;

      const lead = leadOptions.find(l => l.label === leadLabel);
      const eventDate = new Date(dateStr + 'T00:00:00');
      const actByDate = new Date(eventDate);
      actByDate.setDate(actByDate.getDate() - lead.days);

      const daysUntilEvent = Math.round((eventDate - today) / 86400000);
      const daysUntilActBy = Math.round((actByDate - today) / 86400000);

      entries.push({ name, eventDate, actByDate, daysUntilEvent, daysUntilActBy });
    });

    entries.sort((a, b) => a.daysUntilActBy - b.daysUntilActBy);

    entries.forEach(e => {
      let cls, topLine;
      const actByStr = e.actByDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const eventStr = e.eventDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

      if (e.daysUntilActBy < 0) {
        cls = 'overdue';
        topLine = `${e.name} — act-by date has passed`;
      } else if (e.daysUntilActBy <= 7) {
        cls = 'soon';
        topLine = `${e.name} — act by ${actByStr} (${e.daysUntilActBy}d)`;
      } else {
        cls = 'ok';
        topLine = `${e.name} — act by ${actByStr} (${e.daysUntilActBy}d)`;
      }

      const row = document.createElement('div');
      row.className = 'status-row ' + cls;
      row.innerHTML = `<div class="top-line"><span>${topLine}</span></div><div class="sub-line">Occasion itself: ${eventStr} (${e.daysUntilEvent}d away)</div>`;
      resultBox.appendChild(row);
    });

    if (!anyEntries) {
      resultBox.innerHTML = '<div class="status-row soon"><div class="top-line">Add a name and date to at least one occasion</div></div>';
    }
  });
})();
</script>

</body>
</html>
