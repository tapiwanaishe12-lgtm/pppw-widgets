<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Subscription Cost Calculator</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 480px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .row {
    display: grid;
    grid-template-columns: 1.3fr 0.9fr 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row input, .row select {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .row input:focus, .row select:focus { outline: none; border-color: var(--ppw-green); }
  .remove-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .col-labels {
    display: grid;
    grid-template-columns: 1.3fr 0.9fr 1fr auto;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ppw-muted);
    margin-bottom: 6px;
  }
  .add-btn {
    width: 100%;
    padding: 9px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 8px;
    color: var(--ppw-green-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 16px 0;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 12px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .snapshot-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .snapshot-num { font-size: 22px; font-weight: 800; color: var(--ppw-green-dark); line-height: 1.1; }
  .snapshot-label { font-size: 10px; color: var(--ppw-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    background: var(--ppw-green-light);
    border-radius: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Subscription Cost Calculator</h1>
  <div class="desc">Add each bill or subscription with its billing cycle — see what it actually costs you per month, all normalized to one number.</div>

  <div class="col-labels">
    <div>Name</div>
    <div>Amount</div>
    <div>Billed</div>
    <div></div>
  </div>
  <div id="rows"></div>

  <button class="add-btn" id="addBtn">+ Add another bill</button>
  <button class="primary" id="calcBtn">Calculate Monthly Total</button>

  <div class="result" id="resultBox">
    <div class="snapshot-row">
      <div class="snapshot-box">
        <div class="snapshot-num" id="monthlyTotal">£0</div>
        <div class="snapshot-label">Per Month</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="annualTotal">£0</div>
        <div class="snapshot-label">Per Year</div>
      </div>
    </div>
    <div class="note" id="noteBox"></div>
  </div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('rows');
  const freqOptions = [
    { label: 'Weekly', multiplier: 52 / 12 },
    { label: 'Monthly', multiplier: 1 },
    { label: 'Quarterly', multiplier: 1 / 3 },
    { label: 'Annually', multiplier: 1 / 12 }
  ];

  function addRow(name = '') {
    const row = document.createElement('div');
    row.className = 'row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'e.g. Netflix';
    nameInput.value = name;

    const amountInput = document.createElement('input');
    amountInput.type = 'number';
    amountInput.placeholder = '£0';
    amountInput.min = '0';
    amountInput.step = '0.01';

    const freqSelect = document.createElement('select');
    freqOptions.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.label;
      o.textContent = opt.label;
      freqSelect.appendChild(o);
    });
    freqSelect.value = 'Monthly';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(nameInput);
    row.appendChild(amountInput);
    row.appendChild(freqSelect);
    row.appendChild(removeBtn);
    rowsEl.appendChild(row);
  }

  ['Netflix', 'Phone plan', 'Gym membership'].forEach(addRow);

  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('calcBtn').addEventListener('click', () => {
    let monthlyTotal = 0;
    let count = 0;

    rowsEl.querySelectorAll('.row').forEach(row => {
      const amount = parseFloat(row.children[1].value) || 0;
      const freqLabel = row.children[2].value;
      const freq = freqOptions.find(f => f.label === freqLabel);
      if (amount > 0) {
        monthlyTotal += amount * freq.multiplier;
        count++;
      }
    });

    const annualTotal = monthlyTotal * 12;

    document.getElementById('monthlyTotal').textContent = '£' + monthlyTotal.toLocaleString('en-GB', {maximumFractionDigits: 2});
    document.getElementById('annualTotal').textContent = '£' + annualTotal.toLocaleString('en-GB', {maximumFractionDigits: 0});

    const noteBox = document.getElementById('noteBox');
    if (count === 0) {
      noteBox.textContent = 'Add an amount to at least one bill to see your total.';
    } else if (monthlyTotal > 150) {
      noteBox.textContent = `That's £${annualTotal.toLocaleString('en-GB', {maximumFractionDigits: 0})} a year across ${count} bill${count > 1 ? 's' : ''} — worth a quick review of what's actually still used.`;
    } else {
      noteBox.textContent = `Tracking ${count} bill${count > 1 ? 's' : ''} — £${annualTotal.toLocaleString('en-GB', {maximumFractionDigits: 0})} a year in total.`;
    }

    document.getElementById('resultBox').classList.add('show');
  });
})();
</script>

</body>
</html>
