<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volume Distribution Planner</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 520px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 8px;
    margin-top: 16px;
  }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    color: #111827;
  }
  input:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
  }

  .day-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .day-btn {
    flex: 1;
    min-width: 55px;
    padding: 9px 4px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: #111827;
  }
  .day-btn:hover { border-color: #16a34a; }
  .day-btn.selected {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #16a34a;
  }

  .style-row {
    display: flex;
    gap: 8px;
  }
  .style-btn {
    flex: 1;
    padding: 9px 6px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: #111827;
  }
  .style-btn:hover { border-color: #16a34a; }
  .style-btn.selected {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #16a34a;
  }

  button.plan-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.plan-btn:hover { background: #128a3e; }

  .result {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #e5e7eb;
    display: none;
  }
  .result.visible { display: block; }
  .day-result {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
  }
  .day-result:last-child { border-bottom: none; }
  .day-result-name { font-weight: 600; color: #111827; }
  .day-result-value { color: #16a34a; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Volume Distribution Planner</h1>
  <p class="subtitle">Set a weekly total, pick your training days, and spread the load sensibly.</p>

  <label for="totalSetsInput">Weekly volume target (total sets)</label>
  <input type="number" id="totalSetsInput" min="1" placeholder="e.g. 60">

  <label>Which days will you train?</label>
  <div class="day-row" id="dayRow">
    <div class="day-btn" data-day="Mon">Mon</div>
    <div class="day-btn" data-day="Tue">Tue</div>
    <div class="day-btn" data-day="Wed">Wed</div>
    <div class="day-btn" data-day="Thu">Thu</div>
    <div class="day-btn" data-day="Fri">Fri</div>
    <div class="day-btn" data-day="Sat">Sat</div>
    <div class="day-btn" data-day="Sun">Sun</div>
  </div>

  <label>Distribution style</label>
  <div class="style-row" id="styleRow">
    <div class="style-btn selected" data-style="even">Even</div>
    <div class="style-btn" data-style="frontload">Front-loaded</div>
    <div class="style-btn" data-style="taper">Tapered</div>
  </div>

  <button class="plan-btn" onclick="distributeVolume()">Distribute My Volume</button>

  <div class="result" id="result"></div>
</div>

<script>
  let selectedDays = new Set();
  let selectedStyle = 'even';

  document.querySelectorAll('#dayRow .day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const day = btn.getAttribute('data-day');
      if (selectedDays.has(day)) {
        selectedDays.delete(day);
        btn.classList.remove('selected');
      } else {
        selectedDays.add(day);
        btn.classList.add('selected');
      }
    });
  });

  document.querySelectorAll('#styleRow .style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#styleRow .style-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedStyle = btn.getAttribute('data-style');
    });
  });

  const dayOrder = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  function distributeVolume() {
    const total = parseInt(document.getElementById('totalSetsInput').value, 10);
    const result = document.getElementById('result');

    if (isNaN(total) || total <= 0 || selectedDays.size === 0) {
      result.innerHTML = '<p style="font-size:13px;color:#9ca3af;">Enter a weekly total and select at least one training day.</p>';
      result.classList.add('visible');
      return;
    }

    const days = dayOrder.filter(d => selectedDays.has(d));
    const n = days.length;
    let weights;

    if (selectedStyle === 'even') {
      weights = days.map(() => 1);
    } else if (selectedStyle === 'frontload') {
      // Higher weight early in the week, tapering down
      weights = days.map((_, i) => n - i);
    } else {
      // Taper: lower early, building to a peak mid-week then easing off
      weights = days.map((_, i) => {
        const mid = (n - 1) / 2;
        return n - Math.abs(i - mid);
      });
    }

    const weightSum = weights.reduce((sum, w) => sum + w, 0);
    const rawAllocations = weights.map(w => (w / weightSum) * total);

    // Round while preserving total
    let allocations = rawAllocations.map(a => Math.round(a));
    let diff = total - allocations.reduce((sum, a) => sum + a, 0);
    let idx = 0;
    while (diff !== 0) {
      allocations[idx % n] += diff > 0 ? 1 : -1;
      diff += diff > 0 ? -1 : 1;
      idx++;
    }

    result.innerHTML = days.map((day, i) =>
      '<div class="day-result"><span class="day-result-name">' + day + '</span><span class="day-result-value">' + allocations[i] + ' sets</span></div>'
    ).join('');
    result.classList.add('visible');
  }
</script>

</body>
</html>
