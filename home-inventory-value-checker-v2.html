<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Inventory Value Checker</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-red-light: #fbe4e2;
    --ppw-red: #a83a2f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 500px;
    margin: 0 auto;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .currency-select {
    padding: 6px 8px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ppw-green-dark);
    background: #fff;
    flex-shrink: 0;
  }
  .currency-select:focus { outline: none; border-color: var(--ppw-green); }
  .col-labels {
    display: grid;
    grid-template-columns: 1.4fr 1fr auto;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ppw-muted);
    margin-bottom: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 1.4fr 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row input {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .row input:focus { outline: none; border-color: var(--ppw-green); }
  .remove-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .add-btn {
    width: 100%;
    padding: 9px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 8px;
    color: var(--ppw-green-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 16px 0;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  .input-wrap span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ppw-muted);
    font-size: 14px;
  }
  .field input.coverage {
    width: 100%;
    padding: 10px 12px 10px 26px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .field input.coverage:focus { outline: none; border-color: var(--ppw-green); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .snapshot-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .snapshot-num { font-size: 18px; font-weight: 800; color: var(--ppw-green-dark); line-height: 1.1; }
  .snapshot-label { font-size: 10px; color: var(--ppw-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .verdict { border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.4; margin-bottom: 10px; }
  .verdict.balanced { background: var(--ppw-green-light); color: var(--ppw-green-dark); }
  .verdict.flag { background: var(--ppw-red-light); color: var(--ppw-red); }
  .verdict strong { display: block; margin-bottom: 3px; }
  .high-value-note {
    font-size: 12px;
    color: var(--ppw-amber);
    background: var(--ppw-amber-light);
    border-radius: 8px;
    padding: 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <div>
      <div class="eyebrow">Plant Powered Performance World</div>
      <h1>Home Inventory Value Checker</h1>
    </div>
    <select class="currency-select" id="currencySelect">
      <option value="£">£ GBP</option>
      <option value="$">$ USD</option>
      <option value="€">€ EUR</option>
      <option value="A$">A$ AUD</option>
      <option value="C$">C$ CAD</option>
      <option value="NZ$">NZ$ NZD</option>
    </select>
  </div>
  <div class="desc">Add your items with their value — see your total contents value, which items might need separate listing, and whether your insurance actually covers it.</div>

  <div class="col-labels">
    <div>Item</div>
    <div>Value</div>
    <div></div>
  </div>
  <div id="rows"></div>

  <button class="add-btn" id="addBtn">+ Add another item</button>

  <div class="field">
    <label for="coverage">Your current contents insurance limit (optional)</label>
    <div class="input-wrap">
      <span id="coverageSymbol">£</span>
      <input class="coverage" type="number" id="coverage" placeholder="0" min="0" step="1">
    </div>
  </div>

  <button class="primary" id="checkBtn">Check My Coverage</button>

  <div class="result" id="resultBox">
    <div class="snapshot-row">
      <div class="snapshot-box">
        <div class="snapshot-num" id="totalValue">0</div>
        <div class="snapshot-label">Total Value</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="itemCount">0</div>
        <div class="snapshot-label">Items Logged</div>
      </div>
    </div>
    <div class="verdict" id="verdictBox"></div>
    <div class="high-value-note" id="highValueNote" style="display:none;"></div>
  </div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('rows');
  const HIGH_VALUE_THRESHOLD = 1000;
  let currency = '£';

  const currencySelect = document.getElementById('currencySelect');
  currencySelect.addEventListener('change', () => {
    currency = currencySelect.value;
    document.getElementById('coverageSymbol').textContent = currency;
  });

  function addRow(name = '') {
    const row = document.createElement('div');
    row.className = 'row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'e.g. Laptop';
    nameInput.value = name;

    const valueInput = document.createElement('input');
    valueInput.type = 'number';
    valueInput.placeholder = '0';
    valueInput.min = '0';
    valueInput.step = '1';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(nameInput);
    row.appendChild(valueInput);
    row.appendChild(removeBtn);
    rowsEl.appendChild(row);
  }

  ['TV', 'Laptop', 'Sofa'].forEach(addRow);
  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('checkBtn').addEventListener('click', () => {
    let total = 0;
    let count = 0;
    const highValueItems = [];

    rowsEl.querySelectorAll('.row').forEach(row => {
      const name = row.children[0].value.trim();
      const value = parseFloat(row.children[1].value) || 0;
      if (name && value > 0) {
        total += value;
        count++;
        if (value >= HIGH_VALUE_THRESHOLD) {
          highValueItems.push({ name, value });
        }
      }
    });

    document.getElementById('totalValue').textContent = currency + total.toLocaleString('en-GB', {maximumFractionDigits: 0});
    document.getElementById('itemCount').textContent = count;

    const coverage = parseFloat(document.getElementById('coverage').value) || 0;
    const verdictBox = document.getElementById('verdictBox');

    if (count === 0) {
      verdictBox.className = 'verdict flag';
      verdictBox.innerHTML = '<strong>No items logged yet</strong>Add a few items with their value to see your total.';
    } else if (coverage === 0) {
      verdictBox.className = 'verdict flag';
      verdictBox.innerHTML = `<strong>Total logged value: ${currency}${total.toLocaleString('en-GB', {maximumFractionDigits: 0})}</strong>Add your current insurance limit above to check whether it actually covers this.`;
    } else if (total > coverage) {
      const gap = total - coverage;
      verdictBox.className = 'verdict flag';
      verdictBox.innerHTML = `<strong>You may be underinsured by about ${currency}${gap.toLocaleString('en-GB', {maximumFractionDigits: 0})}</strong>Your logged contents value is higher than your current cover — worth reviewing your policy limit.`;
    } else {
      verdictBox.className = 'verdict balanced';
      verdictBox.innerHTML = `<strong>Your cover looks sufficient for what's logged</strong>${currency}${coverage.toLocaleString('en-GB', {maximumFractionDigits: 0})} limit against ${currency}${total.toLocaleString('en-GB', {maximumFractionDigits: 0})} logged value.`;
    }

    const highValueNote = document.getElementById('highValueNote');
    if (highValueItems.length > 0) {
      const list = highValueItems.map(i => `${i.name} (${currency}${i.value.toLocaleString('en-GB', {maximumFractionDigits: 0})})`).join(', ');
      highValueNote.style.display = 'block';
      highValueNote.innerHTML = `<strong>Worth checking individually:</strong> ${list} — many policies cap single-item cover below general contents value, so high-value items sometimes need listing separately.`;
    } else {
      highValueNote.style.display = 'none';
    }

    document.getElementById('resultBox').classList.add('show');
  });
})();
</script>

</body>
</html>
