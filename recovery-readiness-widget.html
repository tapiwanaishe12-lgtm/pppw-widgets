<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Readiness Check</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 500px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .scale-row {
    display: flex;
    gap: 6px;
  }
  .scale-btn {
    flex: 1;
    padding: 10px 0;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: #111827;
  }
  .scale-btn:hover { border-color: #16a34a; }
  .scale-btn.selected {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #16a34a;
  }

  button.check-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.check-btn:hover { background: #128a3e; }

  .result {
    margin-top: 22px;
    padding: 18px;
    border-radius: 10px;
    display: none;
  }
  .result.visible { display: block; }
  .result-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 8px 0;
  }
  .result-message {
    font-size: 13px;
    color: #374151;
    line-height: 1.6;
  }
  .tier-go { background: #f0fdf4; border: 1px solid #bbf7d0; }
  .tier-moderate { background: #fffbeb; border: 1px solid #fde68a; }
  .tier-easy { background: #fef2f2; border: 1px solid #fecaca; }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Recovery Readiness Check</h1>
  <p class="subtitle">Rate three quick things before today's session — let your body help decide the intensity.</p>

  <label>Muscle soreness (1 = none, 5 = very sore)</label>
  <div class="scale-row" id="sorenessRow">
    <div class="scale-btn" data-value="1">1</div>
    <div class="scale-btn" data-value="2">2</div>
    <div class="scale-btn" data-value="3">3</div>
    <div class="scale-btn" data-value="4">4</div>
    <div class="scale-btn" data-value="5">5</div>
  </div>

  <label>Sleep quality last night (1 = poor, 5 = great)</label>
  <div class="scale-row" id="sleepRow">
    <div class="scale-btn" data-value="1">1</div>
    <div class="scale-btn" data-value="2">2</div>
    <div class="scale-btn" data-value="3">3</div>
    <div class="scale-btn" data-value="4">4</div>
    <div class="scale-btn" data-value="5">5</div>
  </div>

  <label>Overall energy today (1 = drained, 5 = energized)</label>
  <div class="scale-row" id="energyRow">
    <div class="scale-btn" data-value="1">1</div>
    <div class="scale-btn" data-value="2">2</div>
    <div class="scale-btn" data-value="3">3</div>
    <div class="scale-btn" data-value="4">4</div>
    <div class="scale-btn" data-value="5">5</div>
  </div>

  <button class="check-btn" onclick="checkReadiness()">Check My Readiness</button>

  <div class="result" id="result">
    <p class="result-title" id="resultTitle"></p>
    <p class="result-message" id="resultMessage"></p>
  </div>
</div>

<script>
  let soreness = null;
  let sleep = null;
  let energy = null;

  function setupScale(rowId, setter) {
    document.querySelectorAll('#' + rowId + ' .scale-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#' + rowId + ' .scale-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        setter(parseInt(btn.getAttribute('data-value'), 10));
      });
    });
  }

  setupScale('sorenessRow', (v) => soreness = v);
  setupScale('sleepRow', (v) => sleep = v);
  setupScale('energyRow', (v) => energy = v);

  function checkReadiness() {
    if (soreness === null || sleep === null || energy === null) return;

    // Invert soreness (high soreness = low readiness)
    const readinessScore = ((6 - soreness) + sleep + energy) / 3;

    const result = document.getElementById('result');
    const title = document.getElementById('resultTitle');
    const message = document.getElementById('resultMessage');

    if (readinessScore >= 3.7) {
      result.className = 'result visible tier-go';
      title.textContent = "✅ Good to go — train as planned";
      title.style.color = '#16a34a';
      message.textContent = "Your body's signals look solid today. This is a good day to train at your planned intensity, including pushing for a PR if one's on the schedule.";
    } else if (readinessScore >= 2.5) {
      result.className = 'result visible tier-moderate';
      title.textContent = "⚠️ Moderate — train, but dial it back slightly";
      title.style.color = '#d97706';
      message.textContent = "Nothing alarming here, but not your sharpest day either. Consider training at 80-90% of planned intensity, or swapping a heavy day for a moderate one if your program allows it.";
    } else {
      result.className = 'result visible tier-easy';
      title.textContent = "🛑 Low readiness — consider an easy day";
      title.style.color = '#dc2626';
      message.textContent = "Soreness, sleep, or energy are genuinely low today. This is a reasonable day for active recovery, mobility work, or a lighter session — pushing hard on a day like this raises injury risk without much training benefit.";
    }
  }
</script>

</body>
</html>
