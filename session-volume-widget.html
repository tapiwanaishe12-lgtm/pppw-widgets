<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Volume Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 540px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }
  .column-labels {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .column-labels .name-col { flex: 2; font-size: 11px; color: #6b7280; font-weight: 600; }
  .column-labels .num-col { flex: 1; font-size: 11px; color: #6b7280; font-weight: 600; text-align: center; }

  .exercise-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .exercise-row input[type="text"] { flex: 2; }
  .exercise-row input[type="number"] { flex: 1; }
  input[type="text"], input[type="number"] {
    padding: 8px 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 12px;
    color: #111827;
  }
  input:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
  }
  .remove-row {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }
  .remove-row:hover { color: #b91c1c; }

  .add-row-btn {
    margin-top: 12px;
    padding: 9px 14px;
    background: #ffffff;
    color: #16a34a;
    border: 1px solid #16a34a;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-row-btn:hover { background: #f0fdf4; }

  button.calc-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.calc-btn:hover { background: #128a3e; }

  .result {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
    display: none;
  }
  .result.visible { display: block; }
  .exercise-result {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
    color: #374151;
  }
  .exercise-result:last-child { border-bottom: none; }
  .total-box {
    margin-top: 14px;
    padding: 14px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    text-align: center;
  }
  .total-value {
    font-size: 24px;
    font-weight: 700;
    color: #16a34a;
  }
  .total-label {
    font-size: 12px;
    color: #4b5563;
  }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Session Volume Calculator</h1>
  <p class="subtitle">Log each exercise's sets, reps, and weight — see your total training volume for the session.</p>

  <div class="column-labels">
    <span class="name-col">Exercise</span>
    <span class="num-col">Sets</span>
    <span class="num-col">Reps</span>
    <span class="num-col">Weight (kg)</span>
  </div>

  <div id="exercisesContainer"></div>
  <button class="add-row-btn" onclick="addExercise()">+ Add Exercise</button>

  <button class="calc-btn" onclick="calculateVolume()">Calculate Session Volume</button>

  <div class="result" id="result">
    <div id="exerciseResults"></div>
    <div class="total-box">
      <div class="total-value" id="totalVolume"></div>
      <div class="total-label">total session volume (kg)</div>
    </div>
  </div>
</div>

<script>
  let rowCount = 0;

  function addExercise(name, sets, reps, weight) {
    rowCount++;
    const container = document.getElementById('exercisesContainer');
    const row = document.createElement('div');
    row.className = 'exercise-row';
    row.setAttribute('data-row-id', rowCount);
    row.innerHTML = `
      <input type="text" placeholder="e.g. Bench press" value="${name || ''}">
      <input type="number" min="1" placeholder="Sets" value="${sets || ''}">
      <input type="number" min="1" placeholder="Reps" value="${reps || ''}">
      <input type="number" min="0" step="0.5" placeholder="kg" value="${weight || ''}">
      <button class="remove-row" onclick="removeExercise(${rowCount})">✕</button>
    `;
    container.appendChild(row);
  }

  function removeExercise(id) {
    const row = document.querySelector('[data-row-id="' + id + '"]');
    if (row) row.remove();
  }

  function calculateVolume() {
    const rows = document.querySelectorAll('.exercise-row');
    const results = [];
    let totalVolume = 0;

    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const name = inputs[0].value.trim();
      const sets = parseFloat(inputs[1].value);
      const reps = parseFloat(inputs[2].value);
      const weight = parseFloat(inputs[3].value);

      if (name && !isNaN(sets) && !isNaN(reps) && !isNaN(weight)) {
        const volume = sets * reps * weight;
        results.push({ name, volume });
        totalVolume += volume;
      }
    });

    const exerciseResults = document.getElementById('exerciseResults');
    exerciseResults.innerHTML = results.map(r =>
      '<div class="exercise-result"><span>' + r.name + '</span><span>' + Math.round(r.volume).toLocaleString() + ' kg</span></div>'
    ).join('');

    document.getElementById('totalVolume').textContent = Math.round(totalVolume).toLocaleString() + ' kg';
    document.getElementById('result').classList.add('visible');
  }

  // Pre-fill with example
  addExercise('Bench press', 4, 6, 80);
  addExercise('Overhead press', 3, 8, 40);
  addExercise('Dips', 3, 10, 0);
</script>

</body>
</html>
