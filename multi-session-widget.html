<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Session Day</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 540px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }
  .column-labels {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .column-labels .name-col { flex: 1.5; font-size: 11px; color: #6b7280; font-weight: 600; }
  .column-labels .num-col { flex: 1; font-size: 11px; color: #6b7280; font-weight: 600; text-align: center; }

  .session-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .session-row select { flex: 1.5; }
  .session-row input[type="number"] { flex: 1; }
  select, input[type="number"] {
    padding: 8px 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 12px;
    color: #111827;
    background: #ffffff;
  }
  select:focus, input:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
  }
  .remove-row {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }
  .remove-row:hover { color: #b91c1c; }

  .add-row-btn {
    margin-top: 12px;
    padding: 9px 14px;
    background: #ffffff;
    color: #16a34a;
    border: 1px solid #16a34a;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-row-btn:hover { background: #f0fdf4; }

  button.calc-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.calc-btn:hover { background: #128a3e; }

  .result {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
    display: none;
  }
  .result.visible { display: block; }
  .session-result {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
  }
  .session-result:last-child { border-bottom: none; }
  .total-box {
    margin-top: 14px;
    padding: 14px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    text-align: center;
  }
  .total-row { display: flex; justify-content: space-around; }
  .total-value { font-size: 20px; font-weight: 700; color: #16a34a; }
  .total-label { font-size: 11px; color: #4b5563; }
  .message {
    font-size: 13px;
    color: #374151;
    margin-top: 12px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Multi-Session Day</h1>
  <p class="subtitle">Log every session from today, even if it's more than one discipline.</p>

  <div class="column-labels">
    <span class="name-col">Discipline</span>
    <span class="num-col">Minutes</span>
    <span class="num-col">RPE</span>
  </div>

  <div id="sessionsContainer"></div>
  <button class="add-row-btn" onclick="addSession()">+ Add Session</button>

  <button class="calc-btn" onclick="calculateDay()">Calculate Today's Total</button>

  <div class="result" id="result"></div>
</div>

<script>
  let rowCount = 0;
  const disciplines = ['Running', 'Lifting', 'Cycling', 'Swimming', 'Cross-Training'];

  function addSession() {
    rowCount++;
    const container = document.getElementById('sessionsContainer');
    const row = document.createElement('div');
    row.className = 'session-row';
    row.setAttribute('data-row-id', rowCount);

    const options = disciplines.map(d => '<option value="' + d + '">' + d + '</option>').join('');

    row.innerHTML = `
      <select>${options}</select>
      <input type="number" min="0" placeholder="min">
      <input type="number" min="1" max="10" placeholder="RPE">
      <button class="remove-row" onclick="removeSession(${rowCount})">✕</button>
    `;
    container.appendChild(row);
  }

  function removeSession(id) {
    const row = document.querySelector('[data-row-id="' + id + '"]');
    if (row) row.remove();
  }

  function calculateDay() {
    const rows = document.querySelectorAll('.session-row');
    const results = [];
    let totalMinutes = 0;
    let totalRPE = 0;
    let rpeCount = 0;

    rows.forEach(row => {
      const select = row.querySelector('select');
      const inputs = row.querySelectorAll('input');
      const discipline = select.value;
      const minutes = parseFloat(inputs[0].value);
      const rpe = parseFloat(inputs[1].value);

      if (!isNaN(minutes) && minutes > 0) {
        results.push({ discipline, minutes, rpe: isNaN(rpe) ? null : rpe });
        totalMinutes += minutes;
        if (!isNaN(rpe)) {
          totalRPE += rpe;
          rpeCount++;
        }
      }
    });

    const result = document.getElementById('result');
    if (results.length === 0) {
      result.innerHTML = '<p style="font-size:13px;color:#9ca3af;">Add at least one session with a duration.</p>';
      result.classList.add('visible');
      return;
    }

    const sessionResults = results.map(r =>
      '<div class="session-result"><span>' + r.discipline + '</span><span>' + r.minutes + ' min' + (r.rpe ? ', RPE ' + r.rpe : '') + '</span></div>'
    ).join('');

    const avgRPE = rpeCount > 0 ? (totalRPE / rpeCount).toFixed(1) : '—';

    let message = '';
    if (results.length >= 2) {
      message = "A " + results.length + "-session day. Total combined load: " + totalMinutes + " minutes. Make sure recovery between sessions today was genuinely adequate, not just squeezed in.";
    }

    result.innerHTML = sessionResults +
      '<div class="total-box"><div class="total-row">' +
      '<div><div class="total-value">' + totalMinutes + '</div><div class="total-label">Total Minutes</div></div>' +
      '<div><div class="total-value">' + avgRPE + '</div><div class="total-label">Avg RPE</div></div>' +
      '</div></div>' +
      (message ? '<p class="message">' + message + '</p>' : '');

    result.classList.add('visible');
  }

  addSession();
</script>

</body>
</html>
