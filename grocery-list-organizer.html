<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grocery List Organizer</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 480px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 14px; line-height: 1.4; }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
    resize: vertical;
    margin-bottom: 6px;
  }
  textarea:focus { outline: none; border-color: var(--ppw-green); }
  .hint { font-size: 11px; color: var(--ppw-muted); margin-bottom: 14px; }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .category-block { margin-bottom: 12px; }
  .category-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ppw-green-dark);
    background: var(--ppw-green-light);
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .category-items {
    font-size: 13px;
    color: var(--ppw-text);
    line-height: 1.7;
    padding-left: 6px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Grocery List Organizer</h1>
  <div class="desc">Paste your list in any order — one item per line or separated by commas — and get it sorted into aisle categories, ready to shop.</div>

  <textarea id="itemsInput" placeholder="e.g. bananas, oat milk, chicken thighs, pasta, kitchen roll, spinach, cheddar"></textarea>
  <div class="hint">Commas or new lines both work.</div>

  <button class="primary" id="organizeBtn">Organize My List</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const categoryMap = [
    { name: '🥦 Produce', keywords: ['apple','banana','orange','grape','berry','berries','lettuce','spinach','kale','tomato','onion','garlic','potato','carrot','pepper','cucumber','broccoli','avocado','lemon','lime','mushroom','courgette','aubergine','fruit','veg','vegetable','herbs','basil','coriander'] },
    { name: '🥛 Dairy & Eggs', keywords: ['milk','cheese','cheddar','yoghurt','yogurt','butter','cream','egg','eggs','oat milk','almond milk','soy milk'] },
    { name: '🍗 Meat & Fish', keywords: ['chicken','beef','pork','turkey','bacon','sausage','mince','salmon','fish','tuna','prawns','lamb','ham'] },
    { name: '🍞 Bakery', keywords: ['bread','bagel','bun','roll','baguette','tortilla','pita','croissant','cake','muffin'] },
    { name: '❄️ Frozen', keywords: ['frozen','ice cream','peas','fish fingers','pizza'] },
    { name: '🥫 Pantry & Dry Goods', keywords: ['pasta','rice','flour','sugar','oil','sauce','tin','canned','beans','lentils','cereal','oats','stock','spice','salt','pepper','coffee','tea','honey','jam','peanut butter','nuts','crackers','biscuits'] },
    { name: '🧻 Household & Other', keywords: ['kitchen roll','toilet paper','washing','detergent','soap','shampoo','toothpaste','bin bag','foil','cling film','sponge','cleaning'] }
  ];

  function categorize(item) {
    const lower = item.toLowerCase();
    for (const cat of categoryMap) {
      if (cat.keywords.some(kw => lower.includes(kw))) {
        return cat.name;
      }
    }
    return '🗂️ Other';
  }

  document.getElementById('organizeBtn').addEventListener('click', () => {
    const raw = document.getElementById('itemsInput').value;
    const items = raw
      .split(/[,\n]/)
      .map(s => s.trim())
      .filter(Boolean);

    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    resultBox.classList.add('show');

    if (items.length === 0) {
      resultBox.innerHTML = '<div class="category-items">Add a few items above to organize your list.</div>';
      return;
    }

    const grouped = {};
    items.forEach(item => {
      const cat = categorize(item);
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(item);
    });

    const orderedNames = categoryMap.map(c => c.name).concat(['🗂️ Other']);
    orderedNames.forEach(catName => {
      if (!grouped[catName]) return;
      const block = document.createElement('div');
      block.className = 'category-block';

      const title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = catName;

      const itemsDiv = document.createElement('div');
      itemsDiv.className = 'category-items';
      itemsDiv.innerHTML = grouped[catName].map(i => '• ' + i).join('<br>');

      block.appendChild(title);
      block.appendChild(itemsDiv);
      resultBox.appendChild(block);
    });
  });
})();
</script>

</body>
</html>
