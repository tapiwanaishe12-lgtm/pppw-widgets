<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annual Progress Overview</title>
<style>
  :root {
    --green: #16a34a;
    --green-dark: #15803d;
    --green-light: #dcfce7;
    --black: #111111;
    --white: #ffffff;
    --gray: #6b7280;
    --border: #e5e7eb;
    --amber: #d97706;
    --amber-light: #fef3c7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--black);
    padding: 20px;
  }

  .widget {
    max-width: 620px;
    margin: 0 auto;
  }

  .section {
    margin-bottom: 28px;
  }

  .section:last-child {
    margin-bottom: 0;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h2 {
    margin: 0 0 4px 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--black);
  }

  .header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--gray);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 26px 0;
  }

  /* Annual Distance Progress */
  .inputs-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .inputs-row .field {
    flex: 1;
  }

  .inputs-row label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 5px;
  }

  .inputs-row input {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--black);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .inputs-row input:focus {
    border-color: var(--green);
  }

  .progress-track {
    width: 100%;
    height: 22px;
    background: #f3f4f6;
    border-radius: 11px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%);
    width: 0%;
    transition: width 0.3s ease;
    border-radius: 11px 0 0 11px;
  }

  .progress-text {
    text-align: center;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--gray);
    font-weight: 600;
  }

  .progress-text .pct {
    color: var(--green-dark);
    font-weight: 700;
  }

  /* Race Countdown */
  .countdown-input {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
  }

  .countdown-input .field {
    width: 200px;
  }

  .countdown-input label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 5px;
    text-align: center;
  }

  .countdown-input input {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--black);
    outline: none;
    text-align: center;
    transition: border-color 0.15s ease;
  }

  .countdown-input input:focus {
    border-color: var(--green);
  }

  .countdown-result {
    background: var(--green-light);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }

  .countdown-result.urgent {
    background: var(--amber-light);
    border-color: var(--amber);
  }

  .countdown-days {
    font-size: 28px;
    font-weight: 800;
    color: var(--green-dark);
    line-height: 1;
  }

  .countdown-result.urgent .countdown-days {
    color: var(--amber);
  }

  .countdown-label {
    font-size: 12px;
    color: var(--gray);
    font-weight: 600;
    margin-top: 4px;
  }

  .countdown-note {
    font-size: 11.5px;
    color: var(--gray);
    margin-top: 8px;
    font-style: italic;
  }

  /* Quarterly Progress */
  .quarters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .quarter {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
  }

  .quarter .q-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--black);
    margin-bottom: 8px;
  }

  .quarter .status-btns {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .quarter button {
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--gray);
    border-radius: 6px;
    padding: 5px 4px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .quarter button.behind.selected {
    background: #fee2e2;
    border-color: #dc2626;
    color: #dc2626;
  }

  .quarter button.ontrack.selected {
    background: var(--amber-light);
    border-color: var(--amber);
    color: var(--amber);
  }

  .quarter button.smashed.selected {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green-dark);
  }

  @media (max-width: 480px) {
    .quarters {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

<div class="widget">

  <div class="section">
    <div class="header">
      <h2>📏 Annual Distance Progress</h2>
      <p>The big number for the year, at a glance.</p>
    </div>

    <div class="inputs-row">
      <div class="field">
        <label for="annualGoal">Annual Km Target</label>
        <input type="number" id="annualGoal" placeholder="e.g. 1200" min="0">
      </div>
      <div class="field">
        <label for="annualActual">Km So Far</label>
        <input type="number" id="annualActual" placeholder="e.g. 480" min="0">
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="annualFill"></div>
    </div>
    <div class="progress-text" id="annualText">Enter your target and km so far to see progress</div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="header">
      <h2>🏁 Race Countdown</h2>
      <p>Enter your next race date.</p>
    </div>

    <div class="countdown-input">
      <div class="field">
        <label for="raceDate">Next Race Date</label>
        <input type="date" id="raceDate">
      </div>
    </div>

    <div class="countdown-result" id="countdownResult">
      <div class="countdown-days" id="countdownDays">—</div>
      <div class="countdown-label" id="countdownLabel">Pick a date to start the countdown</div>
    </div>
  </div>

  <hr class="divider">

  <div class="section">
    <div class="header">
      <h2>🎯 Quarterly Progress</h2>
      <p>Mark how each quarter is going.</p>
    </div>

    <div class="quarters" id="quarters"></div>
  </div>

</div>

<script>
  // Annual Distance Progress
  const annualGoal = document.getElementById('annualGoal');
  const annualActual = document.getElementById('annualActual');
  const annualFill = document.getElementById('annualFill');
  const annualText = document.getElementById('annualText');

  function updateAnnual() {
    const goal = parseFloat(annualGoal.value);
    const actual = parseFloat(annualActual.value);

    if (!goal || goal <= 0 || isNaN(actual) || actual < 0) {
      annualFill.style.width = '0%';
      annualText.textContent = "Enter your target and km so far to see progress";
      return;
    }

    const pct = Math.min((actual / goal) * 100, 100);
    annualFill.style.width = pct + '%';

    if (actual >= goal) {
      annualText.innerHTML = `<span class="pct">Target hit!</span> ${actual.toLocaleString()} / ${goal.toLocaleString()} km`;
    } else {
      annualText.innerHTML = `<span class="pct">${Math.round(pct)}%</span> of the way — ${actual.toLocaleString()} / ${goal.toLocaleString()} km`;
    }
  }

  annualGoal.addEventListener('input', updateAnnual);
  annualActual.addEventListener('input', updateAnnual);

  // Race Countdown
  const raceDate = document.getElementById('raceDate');
  const countdownResult = document.getElementById('countdownResult');
  const countdownDays = document.getElementById('countdownDays');
  const countdownLabel = document.getElementById('countdownLabel');

  raceDate.addEventListener('change', () => {
    if (!raceDate.value) {
      countdownDays.textContent = '—';
      countdownLabel.textContent = 'Pick a date to start the countdown';
      countdownResult.classList.remove('urgent');
      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(raceDate.value + 'T00:00:00');
    const diffMs = target - today;
    const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

    if (diffDays < 0) {
      countdownDays.textContent = 'Done';
      countdownLabel.textContent = 'That race has been and gone — nice work';
      countdownResult.classList.remove('urgent');
    } else if (diffDays === 0) {
      countdownDays.textContent = 'Today';
      countdownLabel.textContent = "It's race day — trust your training";
      countdownResult.classList.add('urgent');
    } else {
      countdownDays.textContent = diffDays;
      const weeks = Math.floor(diffDays / 7);
      countdownLabel.textContent = `days to go (${weeks} week${weeks !== 1 ? 's' : ''})`;
      if (diffDays <= 14) {
        countdownResult.classList.add('urgent');
        countdownLabel.textContent += ' — taper time';
      } else {
        countdownResult.classList.remove('urgent');
      }
    }
  });

  // Quarterly Progress
  const quarterNames = ['Q1', 'Q2', 'Q3', 'Q4'];
  const statuses = [
    { key: 'behind', label: 'Behind' },
    { key: 'ontrack', label: 'On Track' },
    { key: 'smashed', label: 'Smashed It' }
  ];

  const quartersEl = document.getElementById('quarters');

  quarterNames.forEach(name => {
    const q = document.createElement('div');
    q.className = 'quarter';

    const label = document.createElement('div');
    label.className = 'q-label';
    label.textContent = name;
    q.appendChild(label);

    const btnWrap = document.createElement('div');
    btnWrap.className = 'status-btns';

    statuses.forEach(status => {
      const btn = document.createElement('button');
      btn.className = status.key;
      btn.textContent = status.label;
      btn.addEventListener('click', () => {
        btnWrap.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      btnWrap.appendChild(btn);
    });

    q.appendChild(btnWrap);
    quartersEl.appendChild(q);
  });
</script>

</body>
</html>
