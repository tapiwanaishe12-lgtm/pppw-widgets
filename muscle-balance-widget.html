<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muscle Group Balance Checker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 520px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }

  .muscle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid #f3f4f6;
  }
  .muscle-row:last-child { border-bottom: none; }
  .muscle-label {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: #111827;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stepper-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #ffffff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #111827;
  }
  .stepper-btn:hover { border-color: #16a34a; }
  .stepper-count {
    min-width: 18px;
    text-align: center;
    font-weight: 700;
    color: #16a34a;
    font-size: 13px;
  }

  button.check-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.check-btn:hover { background: #128a3e; }

  .result {
    margin-top: 20px;
    padding: 16px;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    display: none;
  }
  .result.visible { display: block; }
  .result-message {
    font-size: 13px;
    color: #374151;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Muscle Group Balance Checker</h1>
  <p class="subtitle">How many times this week did you train each muscle group directly?</p>

  <div id="muscleList"></div>

  <button class="check-btn" onclick="checkBalance()">Check My Balance</button>

  <div class="result" id="result">
    <div class="result-message" id="resultMessage"></div>
  </div>
</div>

<script>
  const muscleGroups = ['Chest', 'Back', 'Shoulders', 'Legs', 'Arms', 'Core'];
  let counts = {};
  muscleGroups.forEach(m => counts[m] = 0);

  function renderList() {
    const list = document.getElementById('muscleList');
    list.innerHTML = '';

    muscleGroups.forEach(muscle => {
      const row = document.createElement('div');
      row.className = 'muscle-row';
      row.innerHTML = `
        <span class="muscle-label">${muscle}</span>
        <div class="stepper">
          <button class="stepper-btn" onclick="adjust('${muscle}', -1)">−</button>
          <span class="stepper-count" id="count-${muscle}">0</span>
          <button class="stepper-btn" onclick="adjust('${muscle}', 1)">+</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function adjust(muscle, delta) {
    const newVal = counts[muscle] + delta;
    if (newVal < 0 || newVal > 7) return;
    counts[muscle] = newVal;
    document.getElementById('count-' + muscle).textContent = newVal;
  }

  function checkBalance() {
    const values = Object.values(counts);
    const total = values.reduce((sum, v) => sum + v, 0);

    const result = document.getElementById('result');
    const message = document.getElementById('resultMessage');

    if (total === 0) {
      message.textContent = "Log at least one muscle group above to check your balance.";
      result.classList.add('visible');
      return;
    }

    const zeroGroups = muscleGroups.filter(m => counts[m] === 0);
    const highest = muscleGroups.reduce((a, b) => counts[a] > counts[b] ? a : b);
    const lowest = muscleGroups.reduce((a, b) => counts[a] < counts[b] ? a : b);
    const spread = counts[highest] - counts[lowest];

    if (zeroGroups.length > 0) {
      message.textContent = zeroGroups.join(', ') + " haven't been trained directly this week. If that's intentional (a rest week, a focused block), fine — if not, worth adding at least one session before the week ends.";
    } else if (spread >= 3) {
      message.textContent = counts[highest] + "x " + highest + " vs " + counts[lowest] + "x " + lowest + " — a real gap. Consistently neglected muscle groups often become the weak point that limits progress elsewhere, or shows up on your Injury & Niggles Log.";
    } else {
      message.textContent = "Reasonably balanced week across all muscle groups. This is a solid foundation — no group is being significantly neglected.";
    }

    result.classList.add('visible');
  }

  renderList();
</script>

</body>
</html>
