<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Notes</title>
<style>
  :root {
    --green: #16a34a;
    --green-dark: #15803d;
    --green-light: #dcfce7;
    --black: #111111;
    --white: #ffffff;
    --gray: #6b7280;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--white);
    color: var(--black);
    padding: 20px;
  }

  .widget {
    max-width: 560px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
  }

  .header h2 {
    margin: 0 0 4px 0;
    font-size: 17px;
    font-weight: 700;
    color: var(--black);
  }

  .header p {
    margin: 0;
    font-size: 12.5px;
    color: var(--gray);
  }

  .tag-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 8px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .tags button {
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--black);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tags button:hover {
    border-color: var(--green);
  }

  .tags button.selected {
    background: var(--green);
    border-color: var(--green-dark);
    color: var(--white);
  }

  textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    color: var(--black);
    outline: none;
    transition: border-color 0.15s ease;
    margin-bottom: 12px;
  }

  textarea:focus {
    border-color: var(--green);
  }

  textarea::placeholder {
    color: #9ca3af;
  }

  .copy-btn {
    width: 100%;
    background: var(--green);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .copy-btn:hover {
    background: var(--green-dark);
  }

  .copy-btn.copied {
    background: var(--black);
  }

  .log {
    margin-top: 18px;
  }

  .log-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gray);
    margin-bottom: 8px;
  }

  .log-entry {
    background: var(--green-light);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12.5px;
    color: var(--black);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .log-entry .tag-chip {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--green-dark);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 3px;
  }

  .log-entry .remove-entry {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
  }

  .log-empty {
    font-size: 12px;
    color: var(--gray);
    text-align: center;
    padding: 10px 0;
  }
</style>
</head>
<body>

<div class="widget">
  <div class="header">
    <h2>📝 Quick Note</h2>
    <p>Jot it down now, tag it, then copy the ones you want into the tables above.</p>
  </div>

  <div class="tag-label">TAG THIS NOTE</div>
  <div class="tags" id="tags">
    <button data-tag="Highlight">🌟 Highlight</button>
    <button data-tag="Improvement">📈 Improvement</button>
    <button data-tag="Injury/Health">🦴 Injury/Health</button>
    <button data-tag="Other">💭 Other</button>
  </div>

  <textarea id="noteInput" placeholder="What happened, what you noticed, what to remember..."></textarea>

  <button class="copy-btn" id="addBtn">Add Note</button>

  <div class="log">
    <div class="log-label">THIS MONTH'S NOTES</div>
    <div id="logList">
      <div class="log-empty" id="logEmpty">No notes added yet</div>
    </div>
  </div>
</div>

<script>
  let selectedTag = null;

  document.querySelectorAll('#tags button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#tags button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTag = btn.dataset.tag;
    });
  });

  const noteInput = document.getElementById('noteInput');
  const addBtn = document.getElementById('addBtn');
  const logList = document.getElementById('logList');
  const logEmpty = document.getElementById('logEmpty');

  addBtn.addEventListener('click', () => {
    const text = noteInput.value.trim();
    if (!text) return;

    logEmpty.style.display = 'none';

    const entry = document.createElement('div');
    entry.className = 'log-entry';

    const content = document.createElement('div');
    const tagChip = document.createElement('div');
    tagChip.className = 'tag-chip';
    tagChip.textContent = selectedTag || 'Note';
    const noteText = document.createElement('div');
    noteText.textContent = text;
    content.appendChild(tagChip);
    content.appendChild(noteText);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-entry';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove';
    removeBtn.addEventListener('click', () => {
      entry.remove();
      if (logList.querySelectorAll('.log-entry').length === 0) {
        logEmpty.style.display = 'block';
      }
    });

    entry.appendChild(content);
    entry.appendChild(removeBtn);
    logList.appendChild(entry);

    noteInput.value = '';
    document.querySelectorAll('#tags button').forEach(b => b.classList.remove('selected'));
    selectedTag = null;

    navigator.clipboard.writeText(`[${tagChip.textContent}] ${text}`);
    addBtn.textContent = 'Added & Copied ✓';
    addBtn.classList.add('copied');
    setTimeout(() => {
      addBtn.textContent = 'Add Note';
      addBtn.classList.remove('copied');
    }, 1400);
  });
</script>

</body>
</html>
