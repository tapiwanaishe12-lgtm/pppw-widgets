<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trip Countdown & Daily Budget</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 440px;
    margin: 0 auto;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 18px; line-height: 1.4; }
  .currency-select {
    padding: 6px 8px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ppw-green-dark);
    background: #fff;
    flex-shrink: 0;
  }
  .currency-select:focus { outline: none; border-color: var(--ppw-green); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ppw-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .field input:focus { outline: none; border-color: var(--ppw-green); }
  .input-wrap { position: relative; }
  .input-wrap span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ppw-muted);
    font-size: 14px;
  }
  .input-wrap input { padding-left: 26px; }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 6px 0 16px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .snapshot-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 12px 6px;
    text-align: center;
  }
  .snapshot-num { font-size: 17px; font-weight: 800; color: var(--ppw-green-dark); line-height: 1.1; }
  .snapshot-label { font-size: 9px; color: var(--ppw-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    background: var(--ppw-green-light);
    border-radius: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <div>
      <div class="eyebrow">Plant Powered Performance World</div>
      <h1>Trip Countdown & Daily Budget</h1>
    </div>
    <select class="currency-select" id="currencySelect">
      <option value="£">£ GBP</option>
      <option value="$">$ USD</option>
      <option value="€">€ EUR</option>
      <option value="A$">A$ AUD</option>
      <option value="C$">C$ CAD</option>
      <option value="NZ$">NZ$ NZD</option>
    </select>
  </div>
  <div class="desc">Enter your trip dates and total budget — see how long you've got until departure, and what that budget actually works out to per day.</div>

  <div class="field">
    <label for="startDate">Trip start date</label>
    <input type="date" id="startDate">
  </div>

  <div class="field">
    <label for="endDate">Trip end date</label>
    <input type="date" id="endDate">
  </div>

  <div class="field">
    <label for="budget">Total trip budget</label>
    <div class="input-wrap">
      <span id="budgetSymbol">£</span>
      <input type="number" id="budget" placeholder="0" min="0" step="1">
    </div>
  </div>

  <button class="primary" id="calcBtn">Calculate</button>

  <div class="result" id="resultBox">
    <div class="snapshot-row">
      <div class="snapshot-box">
        <div class="snapshot-num" id="daysUntil">0</div>
        <div class="snapshot-label">Days To Go</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="tripLength">0</div>
        <div class="snapshot-label">Trip Length</div>
      </div>
      <div class="snapshot-box">
        <div class="snapshot-num" id="dailyBudget">0</div>
        <div class="snapshot-label">Per Day</div>
      </div>
    </div>
    <div class="note" id="noteBox"></div>
  </div>
</div>

<script>
(function() {
  let currency = '£';

  const currencySelect = document.getElementById('currencySelect');
  currencySelect.addEventListener('change', () => {
    currency = currencySelect.value;
    document.getElementById('budgetSymbol').textContent = currency;
  });

  document.getElementById('calcBtn').addEventListener('click', () => {
    const startStr = document.getElementById('startDate').value;
    const endStr = document.getElementById('endDate').value;
    const budget = parseFloat(document.getElementById('budget').value) || 0;

    const resultBox = document.getElementById('resultBox');
    const noteBox = document.getElementById('noteBox');

    if (!startStr || !endStr) {
      document.getElementById('daysUntil').textContent = '–';
      document.getElementById('tripLength').textContent = '–';
      document.getElementById('dailyBudget').textContent = currency + '0';
      noteBox.textContent = 'Add both a start and end date to calculate.';
      resultBox.classList.add('show');
      return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);
    const start = new Date(startStr + 'T00:00:00');
    const end = new Date(endStr + 'T00:00:00');

    const daysUntil = Math.round((start - today) / 86400000);
    const tripLengthDays = Math.round((end - start) / 86400000) + 1;

    document.getElementById('daysUntil').textContent = daysUntil >= 0 ? daysUntil : '0';
    document.getElementById('tripLength').textContent = tripLengthDays > 0 ? tripLengthDays + 'd' : '–';

    if (budget > 0 && tripLengthDays > 0) {
      const dailyBudget = budget / tripLengthDays;
      document.getElementById('dailyBudget').textContent = currency + dailyBudget.toLocaleString('en-GB', {maximumFractionDigits: 0});
    } else {
      document.getElementById('dailyBudget').textContent = currency + '0';
    }

    if (tripLengthDays <= 0) {
      noteBox.textContent = 'End date should be on or after the start date.';
    } else if (daysUntil < 0) {
      noteBox.textContent = 'This trip\'s start date has already passed.';
    } else if (budget === 0) {
      noteBox.textContent = `${tripLengthDays}-day trip, ${daysUntil} days to go. Add a budget to see your daily spend.`;
    } else {
      noteBox.textContent = `${tripLengthDays}-day trip, ${daysUntil} days to go — that's ${currency}${(budget / tripLengthDays).toLocaleString('en-GB', {maximumFractionDigits: 0})} per day of budget to work with.`;
    }

    resultBox.classList.add('show');
  });
})();
</script>

</body>
</html>
