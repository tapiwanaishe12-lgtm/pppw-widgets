<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Next Care Due Tracker</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-red-light: #fbe4e2;
    --ppw-red: #a83a2f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 500px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .col-labels {
    display: grid;
    grid-template-columns: 1.2fr 1.1fr 1fr auto;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ppw-muted);
    margin-bottom: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 1.2fr 1.1fr 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row input, .row select {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .row input:focus, .row select:focus { outline: none; border-color: var(--ppw-green); }
  .remove-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .add-btn {
    width: 100%;
    padding: 9px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 8px;
    color: var(--ppw-green-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 16px 0;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .status-row.ok { background: var(--ppw-green-light); }
  .status-row.soon { background: var(--ppw-amber-light); }
  .status-row.overdue { background: var(--ppw-red-light); }
  .status-row .name { font-weight: 700; color: var(--ppw-text); }
  .status-row .status-text { font-weight: 700; }
  .status-row.ok .status-text { color: var(--ppw-green-dark); }
  .status-row.soon .status-text { color: var(--ppw-amber); }
  .status-row.overdue .status-text { color: var(--ppw-red); }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Next Care Due Tracker</h1>
  <div class="desc">Enter when each care task was last done and how often it repeats — see exactly what's due soon or already overdue.</div>

  <div class="col-labels">
    <div>Care Item</div>
    <div>Last Done</div>
    <div>Repeats</div>
    <div></div>
  </div>
  <div id="rows"></div>

  <button class="add-btn" id="addBtn">+ Add another care item</button>
  <button class="primary" id="checkBtn">Check What's Due</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('rows');
  const freqOptions = [
    { label: 'Monthly', days: 30 },
    { label: 'Every 3 months', days: 91 },
    { label: 'Every 6 months', days: 182 },
    { label: 'Annually', days: 365 }
  ];

  function addRow(name = '') {
    const row = document.createElement('div');
    row.className = 'row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'e.g. Flea treatment';
    nameInput.value = name;

    const dateInput = document.createElement('input');
    dateInput.type = 'date';

    const freqSelect = document.createElement('select');
    freqOptions.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.label;
      o.textContent = opt.label;
      freqSelect.appendChild(o);
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(nameInput);
    row.appendChild(dateInput);
    row.appendChild(freqSelect);
    row.appendChild(removeBtn);
    rowsEl.appendChild(row);
  }

  ['Flea treatment', 'Worming', 'Vaccinations'].forEach(addRow);

  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('checkBtn').addEventListener('click', () => {
    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    resultBox.classList.add('show');

    const today = new Date();
    today.setHours(0,0,0,0);
    let anyEntries = false;

    rowsEl.querySelectorAll('.row').forEach(row => {
      const name = row.children[0].value.trim();
      const lastDoneStr = row.children[1].value;
      const freqLabel = row.children[2].value;

      if (!name || !lastDoneStr) return;
      anyEntries = true;

      const freq = freqOptions.find(f => f.label === freqLabel);
      const lastDone = new Date(lastDoneStr + 'T00:00:00');
      const nextDue = new Date(lastDone);
      nextDue.setDate(nextDue.getDate() + freq.days);

      const daysUntil = Math.round((nextDue - today) / 86400000);

      const statusRow = document.createElement('div');
      let cls, statusText;
      if (daysUntil < 0) {
        cls = 'overdue';
        statusText = `Overdue by ${Math.abs(daysUntil)} day${Math.abs(daysUntil) === 1 ? '' : 's'}`;
      } else if (daysUntil <= 14) {
        cls = 'soon';
        statusText = daysUntil === 0 ? 'Due today' : `Due in ${daysUntil} day${daysUntil === 1 ? '' : 's'}`;
      } else {
        cls = 'ok';
        statusText = `Due in ${daysUntil} days`;
      }

      statusRow.className = 'status-row ' + cls;
      statusRow.innerHTML = `<span class="name">${name}</span><span class="status-text">${statusText}</span>`;
      resultBox.appendChild(statusRow);
    });

    if (!anyEntries) {
      resultBox.innerHTML = '<div class="status-row soon"><span class="name">Add a last-done date to at least one item</span></div>';
    }
  });
})();
</script>

</body>
</html>
