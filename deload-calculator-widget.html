<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deload Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 540px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 28px 24px;
    background: #ffffff;
  }
  .eyebrow {
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #111827;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #4b5563;
    line-height: 1.5;
    margin: 0 0 20px 0;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #111827;
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .reduction-row {
    display: flex;
    gap: 8px;
  }
  .reduction-btn {
    flex: 1;
    padding: 10px 6px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: #111827;
  }
  .reduction-btn:hover { border-color: #16a34a; }
  .reduction-btn.selected {
    border-color: #16a34a;
    background: #f0fdf4;
    color: #16a34a;
  }

  .column-labels {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .column-labels .name-col { flex: 2; font-size: 11px; color: #6b7280; font-weight: 600; }
  .column-labels .num-col { flex: 1; font-size: 11px; color: #6b7280; font-weight: 600; text-align: center; }

  .exercise-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .exercise-row input[type="text"] { flex: 2; }
  .exercise-row input[type="number"] { flex: 1; }
  input[type="text"], input[type="number"] {
    padding: 8px 8px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 12px;
    color: #111827;
  }
  input:focus {
    outline: none;
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
  }
  .remove-row {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }
  .remove-row:hover { color: #b91c1c; }

  .add-row-btn {
    margin-top: 12px;
    padding: 9px 14px;
    background: #ffffff;
    color: #16a34a;
    border: 1px solid #16a34a;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-row-btn:hover { background: #f0fdf4; }

  button.calc-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.calc-btn:hover { background: #128a3e; }

  .result {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
    display: none;
  }
  .result.visible { display: block; }
  .exercise-result {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
  }
  .exercise-result:last-child { border-bottom: none; }
  .exercise-name { font-weight: 600; color: #111827; }
  .exercise-weights { color: #6b7280; }
  .exercise-weights strong { color: #16a34a; }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Plant Powered Performance World</p>
  <h1>Deload Calculator</h1>
  <p class="subtitle">Enter your normal working weights — get suggested deload weights at your chosen reduction.</p>

  <label>Reduction level</label>
  <div class="reduction-row" id="reductionRow">
    <div class="reduction-btn" data-pct="30">Light (30%)</div>
    <div class="reduction-btn selected" data-pct="45">Standard (45%)</div>
    <div class="reduction-btn" data-pct="60">Deep (60%)</div>
  </div>

  <div class="column-labels">
    <span class="name-col">Exercise</span>
    <span class="num-col">Normal Weight (kg)</span>
  </div>
  <div id="exercisesContainer"></div>
  <button class="add-row-btn" onclick="addExercise()">+ Add Exercise</button>

  <button class="calc-btn" onclick="calculateDeload()">Calculate My Deload Weights</button>

  <div class="result" id="result"></div>
</div>

<script>
  let selectedReduction = 45;
  let rowCount = 0;

  document.querySelectorAll('#reductionRow .reduction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#reductionRow .reduction-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedReduction = parseInt(btn.getAttribute('data-pct'), 10);
    });
  });

  function addExercise(name, weight) {
    rowCount++;
    const container = document.getElementById('exercisesContainer');
    const row = document.createElement('div');
    row.className = 'exercise-row';
    row.setAttribute('data-row-id', rowCount);
    row.innerHTML = `
      <input type="text" placeholder="e.g. Bench press" value="${name || ''}">
      <input type="number" min="0" step="0.5" placeholder="kg" value="${weight || ''}">
      <button class="remove-row" onclick="removeExercise(${rowCount})">✕</button>
    `;
    container.appendChild(row);
  }

  function removeExercise(id) {
    const row = document.querySelector('[data-row-id="' + id + '"]');
    if (row) row.remove();
  }

  function calculateDeload() {
    const rows = document.querySelectorAll('.exercise-row');
    const results = [];

    rows.forEach(row => {
      const inputs = row.querySelectorAll('input');
      const name = inputs[0].value.trim();
      const weight = parseFloat(inputs[1].value);

      if (name && !isNaN(weight) && weight > 0) {
        const deloadWeight = weight * (1 - selectedReduction / 100);
        results.push({ name, normal: weight, deload: deloadWeight });
      }
    });

    const result = document.getElementById('result');
    if (results.length === 0) {
      result.innerHTML = '<p style="font-size:13px;color:#9ca3af;">Add at least one exercise with a weight to calculate.</p>';
      result.classList.add('visible');
      return;
    }

    result.innerHTML = results.map(r =>
      '<div class="exercise-result"><span class="exercise-name">' + r.name + '</span><span class="exercise-weights">' + r.normal + 'kg → <strong>' + Math.round(r.deload * 2) / 2 + 'kg</strong></span></div>'
    ).join('');
    result.classList.add('visible');
  }

  // Pre-fill with example
  addExercise('Bench Press', 82.5);
  addExercise('Squat', 100);
  addExercise('Deadlift', 120);
</script>

</body>
</html>
