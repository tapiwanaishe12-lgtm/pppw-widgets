<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chore Rotation Picker</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 460px;
    margin: 0 auto;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ppw-muted);
    margin: 14px 0 8px 0;
  }
  .item-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .item-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .item-row input:focus { outline: none; border-color: var(--ppw-green); }
  .item-row button {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .item-row button:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .add-btn {
    width: 100%;
    padding: 7px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 7px;
    color: var(--ppw-green-dark);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 18px 0 12px 0;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .assignment-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--ppw-green-light);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .assignment-row .chore {
    font-size: 13px;
    font-weight: 600;
    color: var(--ppw-text);
  }
  .assignment-row .person {
    font-size: 13px;
    font-weight: 700;
    color: var(--ppw-green-dark);
  }
  .note {
    font-size: 12px;
    color: var(--ppw-muted);
    text-align: center;
    padding: 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Plant Powered Performance World</div>
  <h1>Chore Rotation Picker</h1>
  <div class="desc">List this week's chores and who's around to do them — shuffle to get a fair, random assignment instead of defaulting to whoever offers first.</div>

  <div class="section-label">Household Members</div>
  <div id="peopleRows"></div>
  <button class="add-btn" id="addPersonBtn">+ Add person</button>

  <div class="section-label">This Week's Chores</div>
  <div id="choreRows"></div>
  <button class="add-btn" id="addChoreBtn">+ Add chore</button>

  <button class="primary" id="shuffleBtn">Shuffle & Assign</button>

  <div class="result" id="resultBox"></div>
</div>

<script>
(function() {
  const peopleRows = document.getElementById('peopleRows');
  const choreRows = document.getElementById('choreRows');

  function addRow(container, placeholder, value = '') {
    const row = document.createElement('div');
    row.className = 'item-row';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = placeholder;
    input.value = value;

    const removeBtn = document.createElement('button');
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(input);
    row.appendChild(removeBtn);
    container.appendChild(row);
  }

  ['Person 1', 'Person 2'].forEach(name => addRow(peopleRows, 'e.g. Sam', ''));
  ['Bins', 'Hoovering', 'Washing up', 'Grocery run'].forEach(() => addRow(choreRows, 'e.g. Bins', ''));

  document.getElementById('addPersonBtn').addEventListener('click', () => addRow(peopleRows, 'e.g. Sam'));
  document.getElementById('addChoreBtn').addEventListener('click', () => addRow(choreRows, 'e.g. Bins'));

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  document.getElementById('shuffleBtn').addEventListener('click', () => {
    const people = Array.from(peopleRows.querySelectorAll('input'))
      .map(i => i.value.trim())
      .filter(Boolean);
    const chores = Array.from(choreRows.querySelectorAll('input'))
      .map(i => i.value.trim())
      .filter(Boolean);

    const resultBox = document.getElementById('resultBox');
    resultBox.innerHTML = '';
    resultBox.classList.add('show');

    if (people.length === 0 || chores.length === 0) {
      resultBox.innerHTML = '<div class="note">Add at least one person and one chore first.</div>';
      return;
    }

    const shuffledPeople = shuffle(people);
    chores.forEach((chore, i) => {
      const assignedPerson = shuffledPeople[i % shuffledPeople.length];
      const row = document.createElement('div');
      row.className = 'assignment-row';
      row.innerHTML = `<span class="chore">${chore}</span><span class="person">${assignedPerson}</span>`;
      resultBox.appendChild(row);
    });

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'Reshuffle any time — nothing here is fixed until you log it in the Family Log.';
    resultBox.appendChild(note);
  });
})();
</script>

</body>
</html>
