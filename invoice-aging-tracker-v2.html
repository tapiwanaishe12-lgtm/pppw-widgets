<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice Aging Tracker</title>
<style>
  :root {
    --ppw-green: #2f6b3a;
    --ppw-green-dark: #1f4d28;
    --ppw-green-light: #eaf5ec;
    --ppw-amber-light: #fdf3e0;
    --ppw-amber: #a8721f;
    --ppw-red-light: #fbe4e2;
    --ppw-red: #a83a2f;
    --ppw-border: #cfe3d3;
    --ppw-text: #1a2e1e;
    --ppw-muted: #5c6f60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--ppw-text);
  }
  .card {
    background: #ffffff;
    border: 1px solid var(--ppw-border);
    border-radius: 14px;
    padding: 24px;
    max-width: 540px;
    margin: 0 auto;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .eyebrow {
    color: var(--ppw-green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; margin: 0 0 8px 0; }
  .desc { font-size: 13px; color: var(--ppw-muted); margin-bottom: 16px; line-height: 1.4; }
  .currency-select {
    padding: 6px 8px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ppw-green-dark);
    background: #fff;
    flex-shrink: 0;
  }
  .currency-select:focus { outline: none; border-color: var(--ppw-green); }
  .col-labels {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr auto;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ppw-muted);
    margin-bottom: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row input {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid var(--ppw-border);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ppw-text);
  }
  .row input:focus { outline: none; border-color: var(--ppw-green); }
  .remove-btn {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1px solid var(--ppw-border);
    background: #fff;
    color: var(--ppw-muted);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: var(--ppw-amber-light); color: var(--ppw-amber); }
  .add-btn {
    width: 100%;
    padding: 9px;
    background: #fff;
    border: 1px dashed var(--ppw-border);
    border-radius: 8px;
    color: var(--ppw-green-dark);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin: 8px 0 16px 0;
  }
  .add-btn:hover { background: var(--ppw-green-light); }
  button.primary {
    width: 100%;
    padding: 13px;
    background: var(--ppw-green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
  }
  button.primary:hover { background: var(--ppw-green-dark); }
  .result { display: none; }
  .result.show { display: block; }
  .snapshot-box {
    background: var(--ppw-green-light);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-bottom: 12px;
  }
  .snapshot-num { font-size: 24px; font-weight: 800; color: var(--ppw-green-dark); line-height: 1.1; }
  .snapshot-label { font-size: 10px; color: var(--ppw-muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .status-row.ok { background: var(--ppw-green-light); }
  .status-row.soon { background: var(--ppw-amber-light); }
  .status-row.overdue { background: var(--ppw-red-light); }
  .status-row .name { font-weight: 700; color: var(--ppw-text); }
  .status-row .status-text { font-weight: 700; text-align: right; }
  .status-row.ok .status-text { color: var(--ppw-green-dark); }
  .status-row.soon .status-text { color: var(--ppw-amber); }
  .status-row.overdue .status-text { color: var(--ppw-red); }
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <div>
      <div class="eyebrow">Plant Powered Performance World</div>
      <h1>Invoice Aging Tracker</h1>
    </div>
    <select class="currency-select" id="currencySelect">
      <option value="£">£ GBP</option>
      <option value="$">$ USD</option>
      <option value="€">€ EUR</option>
      <option value="A$">A$ AUD</option>
      <option value="C$">C$ CAD</option>
      <option value="NZ$">NZ$ NZD</option>
    </select>
  </div>
  <div class="desc">Add outstanding invoices with their amount and due date — see what's overdue, what's due soon, and your total owed at a glance.</div>

  <div class="col-labels">
    <div>Client</div>
    <div>Amount</div>
    <div>Due Date</div>
    <div></div>
  </div>
  <div id="rows"></div>

  <button class="add-btn" id="addBtn">+ Add another invoice</button>
  <button class="primary" id="checkBtn">Check What's Owed</button>

  <div class="result" id="resultBox">
    <div class="snapshot-box">
      <div class="snapshot-num" id="totalOwed">0</div>
      <div class="snapshot-label">Total Outstanding</div>
    </div>
    <div id="statusList"></div>
  </div>
</div>

<script>
(function() {
  const rowsEl = document.getElementById('rows');
  let currency = '£';

  const currencySelect = document.getElementById('currencySelect');
  currencySelect.addEventListener('change', () => {
    currency = currencySelect.value;
  });

  function addRow(name = '') {
    const row = document.createElement('div');
    row.className = 'row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.placeholder = 'e.g. Acme Co';
    nameInput.value = name;

    const amountInput = document.createElement('input');
    amountInput.type = 'number';
    amountInput.placeholder = '0';
    amountInput.min = '0';
    amountInput.step = '0.01';

    const dateInput = document.createElement('input');
    dateInput.type = 'date';

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => row.remove());

    row.appendChild(nameInput);
    row.appendChild(amountInput);
    row.appendChild(dateInput);
    row.appendChild(removeBtn);
    rowsEl.appendChild(row);
  }

  ['Client A', 'Client B'].forEach(addRow);
  document.getElementById('addBtn').addEventListener('click', () => addRow());

  document.getElementById('checkBtn').addEventListener('click', () => {
    const today = new Date();
    today.setHours(0,0,0,0);

    let total = 0;
    const statusList = document.getElementById('statusList');
    statusList.innerHTML = '';

    let anyEntries = false;

    rowsEl.querySelectorAll('.row').forEach(row => {
      const name = row.children[0].value.trim();
      const amount = parseFloat(row.children[1].value) || 0;
      const dueDateStr = row.children[2].value;

      if (!name || amount <= 0 || !dueDateStr) return;
      anyEntries = true;
      total += amount;

      const dueDate = new Date(dueDateStr + 'T00:00:00');
      const daysUntil = Math.round((dueDate - today) / 86400000);

      let cls, statusText;
      if (daysUntil < 0) {
        cls = 'overdue';
        statusText = `Overdue ${Math.abs(daysUntil)}d`;
      } else if (daysUntil <= 7) {
        cls = 'soon';
        statusText = daysUntil === 0 ? 'Due today' : `Due in ${daysUntil}d`;
      } else {
        cls = 'ok';
        statusText = `Due in ${daysUntil}d`;
      }

      const statusRow = document.createElement('div');
      statusRow.className = 'status-row ' + cls;
      statusRow.innerHTML = `<span class="name">${name} — ${currency}${amount.toLocaleString('en-GB', {maximumFractionDigits: 0})}</span><span class="status-text">${statusText}</span>`;
      statusList.appendChild(statusRow);
    });

    document.getElementById('totalOwed').textContent = currency + total.toLocaleString('en-GB', {maximumFractionDigits: 0});

    if (!anyEntries) {
      statusList.innerHTML = '<div class="status-row soon"><span class="name">Add an amount and due date to at least one invoice</span></div>';
    }

    document.getElementById('resultBox').classList.add('show');
  });
})();
</script>

</body>
</html>
